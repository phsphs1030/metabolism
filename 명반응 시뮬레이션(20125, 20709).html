
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>광합성 명반응 시뮬레이션</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07131d;
  color:#eaf4f5;
  font-family:Arial,"Noto Sans KR",sans-serif;
}
.app{
  width:100%;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 12px;
}
.header{text-align:center;margin-bottom:14px}
.header h1{font-size:25px;color:#d5f5df;margin:0 0 8px}
.header p{font-size:12px;letter-spacing:3px;color:#7999aa;margin:0}
.stage{
  width:min(1200px,100%);
  overflow:hidden;
  border:1px solid #263e4d;
  border-radius:20px;
  background:radial-gradient(ellipse at center,#183440,#09151e 78%);
  box-shadow:0 20px 60px #0005;
}
svg{
  display:block;
  width:100%;
  height:auto;
}
.controls{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  padding:15px;
}
button{
  background:#19303d;
  color:#e9f2f4;
  border:1px solid #3d5969;
  padding:10px 17px;
  border-radius:10px;
  font-size:14px;
  cursor:pointer;
}
button.active{
  background:#287d61;
  border-color:#76ddb1;
}
.info{
  width:min(1000px,95%);
  margin-top:12px;
  padding:16px 20px;
  border:1px solid #2e4959;
  border-radius:14px;
  background:#0d1e29;
}
#stepTitle{color:#b9f1d0;font-size:17px;font-weight:bold}
#stepText{color:#c8d9e1;font-size:14px;line-height:1.8;margin:8px 0 0}
.legend{
  display:flex;flex-wrap:wrap;gap:15px;
  margin-top:14px;font-size:12px;color:#a9c1ce
}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.eDot{background:#55e5ff;box-shadow:0 0 9px #55e5ff}
.hDot{background:#ff7189;box-shadow:0 0 9px #ff7189}
.lDot{background:#ffe36a;box-shadow:0 0 9px #ffe36a}
.aDot{background:#ffb94e;box-shadow:0 0 9px #ffb94e}

@media(max-width:600px){
  .app{padding:10px 5px}
  .header h1{font-size:19px}
  .info{padding:12px}
  #stepTitle{font-size:15px}
  #stepText{font-size:12px}
  button{font-size:12px;padding:9px 12px}
}
</style>
</head>

<body>
<div class="app">

<div class="header">
<h1>광합성 명반응</h1>
<p>LIGHT-DEPENDENT REACTIONS</p>
</div>

<div class="stage">
<svg id="diagram" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">

<defs>

    <stop offset="0%" stop-color="#f1d38b"/>

    <stop offset="50%" stop-color="#927048"/>
    <stop offset="75%" stop-color="#cba361"/>
    <stop offset="100%" stop-color="#efd18b"/>
  </linearGradient>

  <linearGradient id="proteinGreen" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#69e2a1"/>
    <stop offset="1" stop-color="#168252"/>
  </linearGradient>

  <linearGradient id="proteinBlue" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#a6eaff"/>
    <stop offset="1" stop-color="#3387c2"/>
  </linearGradient>

  <linearGradient id="proteinOrange" x1="0" y1="0" x2="1" y2="1">

    <stop offset="1" stop-color="#8854c4"/>

  <filter id="glow">

</defs>

<!-- 스트로마 배경 -->
<rect x="0" y="0" width="1200" height="760" fill="#0c1c28"/>
<rect x="20" y="25" width="1160" height="355" rx="25" fill="#142c38" opacity=".65"/>

<!-- 틸라코이드 내부 -->
<rect x="20" y="490" width="1160" height="240" rx="22" fill="#102e40"/>

<!-- NADP / NADPH -->
<g id="nadp">

  <circle cx="1010" cy="175" r="32" fill="#2ba777" stroke="#9affc8" stroke-width="2"/>

  <path d="M882 190 Q920 240 983 195" fill="none" stroke="#3ad3a3" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

<!-- ATP 합성효소: 막을 관통하는 구조 -->
<g id="atpase">

    <path d="M1080 350 L1105 325" stroke="#fff4c8" stroke-width="8" stroke-linecap="round"/>
    <path d="M1080 350 L1055 375" stroke="#fff4c8" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="1080" y="580" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffe7b0">ATP SYNTHASE</text>
</g>

<!-- 빛 -->
<g id="light">
  <path d="M100 195 L140 245 L125 252 L157 300 L115 270 L130 260Z" fill="#ffe36c" filter="url(#glow)"/>
  <text x="105" y="185" font-size="20" fill="#ffdf75" font-weight="bold">LIGHT</text>

  <path d="M660 195 L700 245 L685 252 L717 300 L675 270 L690 260Z" fill="#ffe36c" filter="url(#glow)"/>
  <text x="665" y="185" font-size="20" fill="#ffdf75" font-weight="bold">LIGHT</text>
</g>

<!-- 물 분해 -->
<g id="water">

  <text x="130" y="596" text-anchor="middle" font-size="21" font-weight="bold" fill="white">H₂O</text>
  <text x="130" y="645" text-anchor="middle" font-size="15" fill="#c0edff">물 분해</text>

  <circle cx="220" cy="600" r="25" fill="#7fc7d8" stroke="#d6faff" stroke-width="2"/>
  <text x="220" y="606" text-anchor="middle" font-size="18" fill="#fff">O₂</text>
  <text x="220" y="646" text-anchor="middle" font-size="14" fill="#c0edff">산소 방출</text>
</g>

<!-- ATP 생성 -->
<g id="atp">
  <circle cx="1030" cy="115" r="28" fill="#e6a740" stroke="#ffdf8c" stroke-width="3"/>
  <text x="1030" y="121" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">ADP</text>

  <circle cx="1125" cy="115" r="25" fill="#d18d34" stroke="#ffdc8c" stroke-width="3"/>
  <text x="1125" y="121" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">ATP</text>

  <text x="1077" y="160" text-anchor="middle" font-size="15" fill="#ffdd94">ATP 생성</text>
  <path d="M1058 143 Q1077 155 1102 140" stroke="#ffc55c" stroke-width="5" fill="none" marker-end="url(#arrowGold)"/>
</g>

<!-- 전자 전달 경로 -->
<path d="M175 420 C230 405 270 410 315 420 S400 430 450 420 S540 445 600 468 S665 445 720 420 S800 400 835 385 S900 350 927 330"
      fill="none" stroke="#50dfff" stroke-width="3" opacity=".30" stroke-dasharray="9 9" marker-end="url(#arrowBlue)"/>

<!-- H+ 이동 경로: lumen 내부에서 ATP synthase -->
<path d="M160 530 C270 550 400 565 560 570 S870 570 1020 550 Q1060 530 1080 490 L1080 420"
      fill="none" stroke="#ff7189" stroke-width="3" opacity=".45" stroke-dasharray="6 7" marker-end="url(#arrowRed)"/>

<!-- H+ 이동: PQ와 b6f를 통한 lumen 축적 -->
<path d="M315 400 Q370 470 445 515 Q490 550 540 560"
      fill="none" stroke="#ff7189" stroke-width="2" opacity=".35" stroke-dasharray="6 8"/>

<!-- 전자 입자: PSII -> PQ -> b6f -> PC -> PSI -> Fd -> FNR -->
<g>
  <circle r="8" fill="#55e7ff" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M175 420 C230 405 270 410 315 420 S400 430 450 420 S540 445 600 468 S665 445 720 420 S800 400 835 385 S900 350 927 330"/>
  </circle>
  <circle r="6" fill="#a4f5ff">
    <animateMotion dur="5s" begin="-1.66s" repeatCount="indefinite" path="M175 420 C230 405 270 410 315 420 S400 430 450 420 S540 445 600 468 S665 445 720 420 S800 400 835 385 S900 350 927 330"/>
  </circle>
  <circle r="5" fill="#55e7ff">
    <animateMotion dur="5s" begin="-3.33s" repeatCount="indefinite" path="M175 420 C230 405 270 410 315 420 S400 430 450 420 S540 445 600 468 S665 445 720 420 S800 400 835 385 S900 350 927 330"/>
  </circle>
</g>

<!-- H+ 입자: lumen에서 ATP synthase로 이동 -->
<g fill="#ff7189" filter="url(#glow)">
  <circle r="9">
    <animateMotion dur="4s" repeatCount="indefinite" path="M160 530 C270 550 400 565 560 570 S870 570 1020 550 Q1060 530 1080 490 L1080 420"/>
  </circle>
  <circle r="7">
    <animateMotion dur="4s" begin="-1.3s" repeatCount="indefinite" path="M160 530 C270 550 400 565 560 570 S870 570 1020 550 Q1060 530 1080 490 L1080 420"/>
  </circle>
  <circle r="8">
    <animateMotion dur="4s" begin="-2.6s" repeatCount="indefinite" path="M160 530 C270 550 400 565 560 570 S870 570 1020 550 Q1060 530 1080 490 L1080 420"/>

  <circle r="8">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M1080 420 L1080 340 L1080 275"/>
  </circle>
  <circle r="7">
    <animateMotion dur="2.5s" begin="-1.2s" repeatCount="indefinite" path="M1080 420 L1080 340 L1080 275"/>

<!-- 하단 기능 설명 -->
<text x="300" y="630" font-size="17" fill="#ffb6c4">H⁺ 축적</text>
<text x="850" y="630" font-size="17" fill="#ffb6c4">양성자 기울기</text>
<text x="1080" y="250" text-anchor="middle" font-size="14" fill="#ffdf9c">H⁺ 유입</text>

</svg>
</div>

<div class="controls">
<button id="pauseBtn" onclick="togglePause()">Ⅱ 정지</button>
<button onclick="showMode('all',this)" class="active">전체 과정</button>
<button onclick="showMode('electron',this)">전자 이동</button>
<button onclick="showMode('proton',this)">H⁺ 이동</button>
<button onclick="showMode('light',this)">빛 흡수</button>
<button onclick="resetSim()">초기화</button>
</div>

<div class="info">
<div id="stepTitle">광계 II — 빛 흡수</div>
<p id="stepText">광계 II가 빛을 흡수하고 물의 광분해를 통해 전자를 보충받습니다. 전자는 전달계를 따라 이동하기 시작합니다.</div>

<div class="legend">
<span><i class="dot eDot"></i>전자</span>
<span><i class="dot hDot"></i>수소 이온 H⁺</span>
<span><i class="dot lDot"></i>빛</span>
<span><i class="dot aDot"></i>ATP 생성</span>
</div>
</div>

<script>
const stepTitle=document.getElementById("stepTitle");
const stepText=document.getElementById("stepText");
const pauseBtn=document.getElementById("pauseBtn");

let paused=false;
let mode="all";
let time=0;
let raf;

const stages=[
{
title:"① 광계 II — 빛 흡수와 물의 광분해",
text:"광계 II의 P680이 빛에너지를 흡수하여 전자를 높은 에너지 상태로 올립니다. 물 분해 과정에서 전자가 보충되고 H⁺가 틸라코이드 내부에 방출되며 산소가 생성됩니다."
},
{
title:"② 플라스토퀴논(PQ) — 전자와 H⁺ 운반",
text:"플라스토퀴논은 광계 II에서 전달받은 전자를 운반합니다. 스트로마에서 H⁺를 받아 PQH₂가 된 뒤 시토크롬 b6f 복합체로 이동하여 전자와 H⁺를 전달합니다."
},
{
title:"③ 시토크롬 b6f — 전자 전달과 양성자 축적",
text:"전자전달 과정에서 틸라코이드 내부로 H⁺가 축적되는 데 기여합니다. 이렇게 만들어지는 H⁺ 농도 차이는 ATP 합성의 에너지원이 됩니다."
},
{
title:"④ 플라스토시아닌(PC) — 광계 I으로 전달",
text:"플라스토시아닌은 시토크롬 b6f에서 전자를 받아 광계 I의 P700으로 전달합니다. 전자전달은 막 주변의 운반 단백질 사이에서 이어집니다."
},
{
title:"⑤ 광계 I — 전자의 재활성화",
text:"광계 I은 빛을 흡수하여 전달받은 전자를 다시 높은 에너지 상태로 올립니다. 활성화된 전자는 페레독신(Fd)으로 전달됩니다."
},
{
title:"⑥ Fd와 FNR — NADPH 생성",
text:"페레독신이 전자를 FNR에 전달합니다. FNR은 전자와 H⁺를 이용하여 NADP⁺를 NADPH로 환원합니다. NADPH는 이후 탄소 고정 반응에 사용됩니다."
},
{
title:"⑦ ATP 합성효소 — ATP 생성",
text:"틸라코이드 내부에 축적된 H⁺가 ATP 합성효소를 통해 스트로마 쪽으로 이동합니다. 이 흐름의 에너지로 ADP와 무기 인산이 결합해 ATP가 만들어집니다."
}
];

function updateText(){
  const idx=Math.floor(time/4)%stages.length;
  stepTitle.textContent=stages[idx].title;
  stepText.textContent=stages[idx].text;
}

function animate(){
  if(!paused){
    time+=0.016;
    updateText();
  }
  raf=requestAnimationFrame(animate);
}

function togglePause(){
  paused=!paused;
  pauseBtn.textContent=paused?"▶ 재생":"Ⅱ 정지";
}

function showMode(m,b){
  mode=m;
  document.querySelectorAll(".controls button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");

  const electron=document.querySelectorAll('[fill="#55e7ff"],[fill="#a4f5ff"]');
  const proton=document.querySelectorAll('[fill="#ff7189"]');
  const light=document.querySelectorAll('[fill="#ffe36b"]');

  if(m==="all"){
    electron.forEach(x=>x.style.opacity="1");
    proton.forEach(x=>x.style.opacity="1");
    light.forEach(x=>x.style.opacity="1");
  }else if(m==="electron"){
    electron.forEach(x=>x.style.opacity="1");
    proton.forEach(x=>x.style.opacity=".10");
    light.forEach(x=>x.style.opacity=".10");
  }else if(m==="proton"){
    electron.forEach(x=>x.style.opacity=".10");
    proton.forEach(x=>x.style.opacity="1");
    light.forEach(x=>x.style.opacity=".10");
  }else if(m==="light"){
    electron.forEach(x=>x.style.opacity=".10");
    proton.forEach(x=>x.style.opacity=".10");
    light.forEach(x=>x.style.opacity="1");
  }
}

function resetSim(){
  paused=false;
  time=0;
  mode="all";
  pauseBtn.textContent="Ⅱ 정지";
  updateText();
  document.querySelectorAll(".controls button").forEach(x=>x.classList.remove("active"));
  document.querySelector(".controls button:nth-child(2)").classList.add("active");
  showModeReset();
}
function showModeReset(){
  const electron=document.querySelectorAll('[fill="#55e7ff"],[fill="#a4f5ff"]');
  const proton=document.querySelectorAll('[fill="#ff7189"]');
  const light=document.querySelectorAll('[fill="#ffe36b"]');
  electron.forEach(x=>x.style.opacity="1");
  proton.forEach(x=>x.style.opacity="1");
  light.forEach(x=>x.style.opacity="1");
}

animate();
</script>
