<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세포호흡 시뮬레이션</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf8;--sf:#fff;--ink:#1c2523;--mu:#5d6967;--ln:#dfe4e2;--cy:#b45309;--cyb:#fdf3e4;--mt:#0f766e;--mtb:#e2f3f0;--ims:#e6eefa;--cb:#4b5755;--fm:#6d4aa8;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141918;--sf:#1c2321;--ink:#e8eeec;--mu:#9aa8a5;--ln:#2e3936;--cy:#f0a64a;--cyb:#2b2214;--mt:#4fc9bc;--mtb:#12302c;--ims:#172433;--cb:#9bb0ac;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141918;--sf:#1c2321;--ink:#e8eeec;--mu:#9aa8a5;--ln:#2e3936;--cy:#f0a64a;--cyb:#2b2214;--mt:#4fc9bc;--mtb:#12302c;--ims:#172433;--cb:#9bb0ac;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.65 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
main{max-width:1120px;margin:0 auto;padding:24px 20px 56px}
h1{font-size:32px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 16px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.tabs button{font:inherit;font-size:16px;font-weight:500;white-space:nowrap;padding:8px 16px;border:1px solid var(--ln);border-radius:99px;background:var(--sf);color:var(--mu);cursor:pointer}
.tabs button[aria-current="true"]{background:var(--mt);border-color:var(--mt);color:var(--bg);font-weight:700}
button:focus-visible{outline:3px solid var(--mt);outline-offset:2px}
.fl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px;font-size:15px}.fl span{padding:4px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--mu)}.fl span.dn{color:var(--ink);border-color:var(--mt)}.fl span.on{background:var(--mt);color:var(--bg);border-color:var(--mt);font-weight:700}.fl i{font-style:normal;color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 230px;gap:16px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px 18px}
svg{width:100%;height:auto;display:block}
svg text{font-family:inherit}
.cy{fill:var(--cyb);stroke:var(--ln);stroke-width:2}.mt{fill:var(--mtb);stroke:var(--mt);stroke-width:3}.ims{fill:var(--ims)}.mx{fill:var(--mtb)}.pl{fill:var(--bg);stroke:var(--ln);stroke-width:2}
.lb{font-size:15px;fill:var(--mu)}.bt{font-size:17px;font-weight:700;fill:var(--ink)}.ar{font-size:30px;fill:var(--mt)}
.bx{fill:var(--sf);stroke:var(--mt);stroke-width:2.5}.ring{fill:none;stroke:var(--mt);stroke-width:3;stroke-dasharray:7 7;opacity:.6}
.mb{fill:var(--mt);opacity:.3}.cx{fill:var(--mt)}.cxt{fill:#fff;font-size:20px;font-weight:700}
.cb{fill:var(--cb)}.pp{fill:#e8b83c;stroke:#9a7314;stroke-width:1.5}.pt{font-size:14px;font-weight:700;fill:#3b2a00}
.tk{stroke:rgba(0,0,0,.25);stroke-width:1}.tt{font-size:15px;font-weight:700;fill:#1c2523}
.atp{fill:#f5c542}.adp{fill:#cfd6d4}.nadh{fill:#f4a261}.nad{fill:#cfd6d4}.fad{fill:#ee8b6b}.co2{fill:#d9dedd}.h2o{fill:#8ecae6}.h{fill:#b9d7f5}.o2{fill:#a8dadc}.tg{fill:#e5e0f5}
.dot{fill:#f5c542;stroke:#9a7314;stroke-width:2}
g.e{transition:transform .9s ease,opacity .7s ease}
@media(prefers-reduced-motion:reduce){g.e{transition:none}}
.cap h2{font-size:21px;margin:0 0 2px}.pl2{font-size:15px;font-weight:700;color:var(--cy)}.pl2.m{color:var(--mt)}
.cap p{margin:6px 0 0;font-size:19px}
.nav{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.nav button{font:inherit;font-weight:700;padding:8px 20px;border-radius:10px;border:1px solid var(--mt);background:var(--mt);color:var(--bg);cursor:pointer}
.nav button.g{background:none;color:var(--mt)}.nav button:disabled{opacity:.35;cursor:default}
.nav span{margin-left:auto;color:var(--mu);font-size:16px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tl div{border:1px solid var(--ln);border-radius:10px;padding:4px 10px;background:var(--bg)}
.tl b{font-size:26px;display:block;line-height:1.25}.tl small{color:var(--mu);font-size:14px}
.ab{height:12px;border-radius:6px;background:var(--ln);overflow:hidden}.ab i{display:block;height:100%;background:var(--mt);width:0;transition:width .6s}
small.n{color:var(--mu);font-size:14px;line-height:1.5;display:block;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>세포호흡 시뮬레이션</h1>
<p class="sub">포도당 1분자가 분해되는 과정을 처음부터 끝까지 따라가 보자. 단계 버튼을 누르거나 자동 재생을 켜면 된다.</p>
<div class="tabs" id="tabs"></div>
<div class="fl" id="fl" aria-label="탄소의 이동 흐름"></div>
<div class="grid">
<div>
<div class="card"><svg id="sv" viewBox="0 0 800 400" role="img" aria-label="세포호흡 단계별 시뮬레이션"><g id="bg"></g><g id="fg"></g></svg></div>
<div class="card cap" style="margin-top:12px"><h2 id="t"></h2><div class="pl2" id="w"></div><p id="d"></p>
<div class="nav"><button class="g" id="pv">이전</button><button id="nx">다음</button><button class="g" id="pl">자동 재생</button><span id="pg"></span></div></div>
</div>
<div class="card"><b>지금까지 생성된 양</b>
<div class="tl"><div><b id="vA">0</b><small>ATP (순)</small></div><div><b id="vN">0</b><small>NADH</small></div><div><b id="vF">0</b><small>FADH₂</small></div><div><b id="vC">0</b><small>CO₂</small></div></div>
<small style="color:var(--mu);font-size:14px">ATP 합성량 (최대 32)</small><div class="ab"><i id="bar"></i></div>
<small class="n">수치는 포도당 1분자(피루브산 2분자) 기준이다. 화면의 그림은 이해를 돕기 위해 분자 1개를 대표로 보여 준다.</small></div>
</div>
</main>

S('H⁺이 농도 기울기에 따라 ATP 합성효소를 통해 바탕질로 확산(화학 삼투)하고, 이때 ATP가 합성된다. H⁺ 4개당 ATP 1분자이며 NADH 1분자는 약 2.5, FADH₂ 1분자는 약 1.5ATP를 만든다.',{hs:[640,330,1],atT:1},{a:28})]},
{n:'ATP 수지',p:'포도당 1분자의 결과',bg:R(4,4,792,392,24,'pl'),

s:[S('기질수준인산화로 해당 과정에서 2분자, TCA 회로에서 2분자, 모두 4분자의 ATP가 만들어진다.',{c1:1}),
S('산화적 인산화는 NADH 10분자(× 2.5)와 FADH₂ 2분자(× 1.5)로 ATP 28분자를 만든다.',{c2:1}),
S('포도당 1분자가 완전히 분해되면 ATP가 최대 32분자 생성된다.',{c3:1}),
S('포도당 에너지의 약 34 %가 ATP에 저장되고, 나머지는 열로 방출되어 체온 유지 등에 쓰인다.',{c4:1})]},
{n:'발효 (산소 없음)',p:'장소: 세포질',f:1,bg:CY,

E('lacA',C(3),430,110),E('lL',L('젖산 (C₃)','start'),430,150),E('ndA',T('NAD⁺','nad'),350,45),E('ach',C(2),330,290),E('lAc',L('아세트알데하이드 (C₂)','start'),330,330),E('co2',T('CO₂','co2'),230,345),E('eth',C(2),480,290),E('lE',L('에탄올 (C₂)','start'),480,330),E('ndB',T('NAD⁺','nad'),400,225)],
s:[S('산소가 없으면 전자전달계가 작동하지 않아 해당 과정만으로 ATP 2분자를 얻는다. 쌓이는 NADH를 처리해 NAD⁺를 되살려야 해당 과정이 계속된다.',{pA:1,pB:1,lpA:1,lpB:1,nA:1,nB:1}),
S('젖산 발효(젖산균, 사람의 근육세포): 피루브산이 NADH로부터 H⁺과 전자를 받아 젖산으로 환원되고 NAD⁺가 재생된다.',{pA:0,lpA:0,lacA:1,lL:1,nA:[350,75,0],ndA:1},{n:-2}),
S('알코올 발효(효모): 피루브산이 CO₂를 내놓고 아세트알데하이드가 된다.',{pB:0,lpB:0,ach:1,lAc:1,co2:1}),
S('아세트알데하이드가 NADH로부터 H⁺과 전자를 받아 에탄올로 환원되고 NAD⁺가 재생된다. 두 발효 모두 ATP는 2분자뿐이다.',{ach:0,lAc:0,eth:1,lE:1,nB:[400,255,0],ndB:1})]}];
var FL=['포도당 (C₆)','피루브산 (C₃) ×2','아세틸조효소 A (C₂) ×2','TCA 회로: CO₂ 배출','전자전달계: H⁺ 수송','ATP 합성 · H₂O'];
function fi(){var s=cur.s,j=cur.j;if(s==1)return j<3?0:1;if(s==2)return j<2?1:j<4?2:3;if(s==3)return j<4?4:5;if(s==4)return 5;return -1}
var cur={s:0,j:0},built=-1,timer=null;
function add(t,v){for(var k in v)t[k]+=v[k]}
function state(){var sc=SC[cur.s],st={};sc.e.forEach(function(e){st[e.id]=e.s.slice()});
for(var j=0;j<=cur.j;j++){var m=sc.s[j].m;for(var k in m){var v=m[k];if(typeof v=='number')st[k][2]=v;else st[k]=v.slice()}}return st}
function put(g,a){g.style.transform='translate('+a[0]+'px,'+a[1]+'px)';g.style.opacity=a[2]}
function draw(){var sc=SC[cur.s],st=state();
if(built!=cur.s){$('bg').innerHTML=sc.bg;$('fg').innerHTML=sc.e.map(function(e){return '<g class="e" id="e_'+e.id+'">'+e.h+'</g>'}).join('');built=cur.s;
sc.e.forEach(function(e){put($('e_'+e.id),st[e.id])})}
else sc.e.forEach(function(e){put($('e_'+e.id),st[e.id])});
$('t').textContent=sc.n+' · '+(cur.j+1)+'단계';$('w').textContent=sc.p;$('w').className='pl2'+(/바탕질|내막/.test(sc.p)?' m':'');$('d').textContent=sc.s[cur.j].c;
var t={a:0,n:0,f:0,c:0};
if(sc.f){t.a=2;t.n=2;for(var j=0;j<=cur.j;j++)add(t,sc.s[j].v)}
else for(var i=0;i<=cur.s;i++){if(SC[i].f)continue;var m=i==cur.s?cur.j:SC[i].s.length-1;for(var j=0;j<=m;j++)add(t,SC[i].s[j].v)}
$('vA').textContent=t.a;$('vN').textContent=t.n;$('vF').textContent=t.f;$('vC').textContent=t.c;$('bar').style.width=Math.max(0,t.a)/32*100+'%';
$('pg').textContent=(cur.j+1)+' / '+sc.s.length;
var first=cur.s==0&&cur.j==0,last=cur.s==SC.length-1&&cur.j==sc.s.length-1;$('pv').disabled=first;$('nx').disabled=last;
Array.prototype.forEach.call($('tabs').children,function(b,i){b.setAttribute('aria-current',i==cur.s)});
var k=fi();$('fl').innerHTML=FL.map(function(x,i){return '<span class="'+(i==k?'on':i<k?'dn':'')+'">'+x+'</span>'}).join('<i>▶</i>');
if(last)stop()}
function next(){var sc=SC[cur.s];if(cur.j<sc.s.length-1)cur.j++;else if(cur.s<SC.length-1){cur.s++;cur.j=0}draw()}
function prev(){if(cur.j>0)cur.j--;else if(cur.s>0){cur.s--;cur.j=SC[cur.s].s.length-1}draw()}
function stop(){clearInterval(timer);timer=null;$('pl').textContent='자동 재생'}
$('tabs').innerHTML=SC.map(function(s,i){return '<button data-i="'+i+'">'+s.n+'</button>'}).join('');
$('tabs').onclick=function(e){var b=e.target.closest('button');if(b){cur={s:+b.dataset.i,j:0};draw()}};
$('nx').onclick=function(){stop();next()};$('pv').onclick=function(){stop();prev()};
$('pl').onclick=function(){if(timer){stop();return}if(cur.s==SC.length-1&&cur.j==SC[cur.s].s.length-1){cur={s:0,j:0};draw()}$('pl').textContent='일시 정지';timer=setInterval(next,5500)};
document.onkeydown=function(e){if(e.key=='ArrowRight'){stop();next()}if(e.key=='ArrowLeft'){stop();prev()}};
draw();
