        <style>
            :root {

            * {

            }

            body {
                margin: 0;
                width: 100%;
                font-family: 'Work Sans',sans-serif;
                color: var(--ink);
            }

            .app-shell {
                width: 100%;
                min-height: 100%;
                padding: clamp(16px,3vw,38px);
                background: radial-gradient(circle at 12% 12%,#eff9d8 0,transparent 34%),radial-gradient(circle at 90% 80%,#cceacb 0,transparent 40%);
            }

            .frame {
                max-width: 1320px;
                margin: auto;
            }

            .topbar {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 24px;
                flex-wrap: wrap;
                margin-bottom: 22px;
            }

            .eyebrow {
                font-size: 12px;
                letter-spacing: .16em;
                font-weight: 800;
                color: #40845e;
                margin-bottom: 6px;
            }

            h1 {
                font-family: 'Work Sans',sans-serif;
                font-weight: 800;
                letter-spacing: -.05em;
                margin: 0;
                line-height: 1.15;
            }

            .subtitle {
                margin-top: 9px;
                color: var(--muted);
            }

            .toggles {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }

            .toggle {
                display: flex;
                align-items: center;
                gap: 10px;
                border: 1px solid #cddfc9;
                background: #fff;
                padding: 11px 15px;
                border-radius: 15px;
                font-weight: 700;
                box-shadow: 0 4px 16px #25583a0a;
                transition: transform .2s,background .2s;
            }

            .toggle:hover,.control:hover {
                transform: translateY(-2px);
            }

            .toggle[aria-pressed="false"] {
                background: #f6e9e3;
                border-color: #e8c9b9;
            }

            .switch {
                width: 32px;
                height: 19px;
                border-radius: 20px;
                background: #46a46f;
                padding: 3px;
                display: inline-flex;
                align-items: center;
                transition: background .2s;
            }

            .switch:after {
                content: '';
                width: 13px;
                height: 13px;
                background: white;
                border-radius: 50%;
                margin-left: 13px;
                transition: margin .2s;
            }

            .toggle[aria-pressed="false"] .switch {
                background: #b99787;
            }

            .toggle[aria-pressed="false"] .switch:after {
                margin-left: 0;
            }

            .stage-wrap {
                overflow-x: auto;
                border-radius: 28px 28px 0 0;
                box-shadow: 0 22px 55px #24523a1c;
            }

            .stage {
                position: relative;
                min-width: 820px;
                height: 420px;
                overflow: hidden;
                border: 8px solid #c8e3b2;
                border-radius: 28px;
                background: radial-gradient(circle at 65% 25%,#f9fbea,#eaf4dc 70%);
            }

            .stage:before {
                content: '';
                position: absolute;
                inset: 12px;
                border: 1px dashed #a6c996;
                border-radius: 20px;
                pointer-events: none;
            }

            .stage:after {
                content: '';
                position: absolute;
                width: 340px;
                height: 340px;
                border: 1px solid #b5d4a562;
                border-radius: 50%;
                right: 50px;
                top: 35px;
                pointer-events: none;

            .zone {

                bottom: 32px;

                        <div class="counter-grid">
                            <div class="counter">
                                <span data-template-id="oxygen-label" class="canva-text counter-label"></span>
                                <output id="oxygen-count" class="counter-number" aria-label="생성된 산소">0</output>
                            </div>
                            <div class="counter">
                                <span data-template-id="atp-label" class="canva-text counter-label"></span>
                                <output id="atp-count" class="counter-number" aria-label="생성된 ATP">0</output>
                            </div>
                            <div class="counter">
                                <span data-template-id="nadph-label" class="canva-text counter-label"></span>
                                <output id="nadph-count" class="counter-number" aria-label="생성된 NADPH">0</output>
                            </div>
                            <div class="counter">
                                <span data-template-id="glucose-label" class="canva-text counter-label"></span>
                                <output id="glucose-count" class="counter-number" aria-label="생성된 포도당">0</output>
                            </div>
                        </div>
                    </aside>
                </div>
            </main>
        </div>
        <script>
            const steps = [{
                title: '1단계 · 물의 광분해와 전자 전달',
                description: '엽록소가 빛을 흡수해 전자를 방출합니다. 물이 분해되면서 잃은 전자를 보충하고, H⁺와 산소가 생성됩니다. 산소는 엽록체 밖으로 방출됩니다.'
            }, {
                title: '2단계 · ATP 합성과 NADPH 생성',
                description: '전자 전달로 형성된 H⁺ 농도 기울기가 ATP 합성 효소를 작동시켜 ATP를 만듭니다. NADP⁺는 전자와 H⁺를 받아 NADPH로 환원됩니다.'
            }, {
                title: '3단계 · 에너지 매개체 이동',
                description: '명반응에서 만들어진 ATP와 NADPH가 스트로마로 이동합니다. 두 물질은 캘빈 회로에 각각 에너지와 환원력을 공급합니다.'
            }, {
                title: '4단계 · 탄소 고정과 당 합성',
                description: 'RuBP가 CO₂를 고정해 3PG를 만듭니다. ATP와 NADPH를 사용하여 PGAL(G3P)을 만들고, 일부가 포도당 합성에 쓰입니다. ADP와 NADP⁺는 명반응으로 돌아갑니다.'
            }];
            let step = 0
              , playing = false
              , lightOn = true
              , co2On = true;
            const counts = {
                oxygen: 0,
                atp: 0,
                nadph: 0,
                glucose: 0
            };
            const stage = document.getElementById('stage');
            const outputs = {
                oxygen: document.getElementById('oxygen-count'),
                atp: document.getElementById('atp-count'),
                nadph: document.getElementById('nadph-count'),
                glucose: document.getElementById('glucose-count')
            };
            const blocked = () => !lightOn || (step === 3 && !co2On);
            function render() {
                stage.dataset.active = String(step + 1);
                stage.classList.toggle('is-blocked', blocked());
                document.getElementById('step-title').textContent = steps[step].title;
                const explanation = document.getElementById('explanation');
                explanation.textContent = !lightOn ? '빛이 없어 엽록소에서 전자가 방출되지 않습니다. 명반응이 멈추어 ATP와 NADPH 공급이 끊기므로 전체 광합성 회로가 정지합니다.' : step === 3 && !co2On ? 'CO₂가 없어 RuBP의 탄소 고정이 진행되지 않습니다. 명반응은 계속될 수 있지만 캘빈 회로와 포도당 생성은 멈춥니다.' : steps[step].description;
                explanation.classList.toggle('warning', blocked());
                document.getElementById('previous').disabled = step === 0;
                document.getElementById('next').disabled = step === 3;
                document.getElementById('play-label').hidden = playing;
                document.getElementById('pause-label').hidden = !playing;
                document.getElementById('play').setAttribute('aria-label', playing ? '일시정지' : '자동 재생');
                document.getElementById('light-toggle').setAttribute('aria-pressed', String(lightOn));
                document.getElementById('co2-toggle').setAttribute('aria-pressed', String(co2On));
                Object.keys(counts).forEach(key => {
                    outputs[key].value = counts[key];
                    outputs[key].textContent = counts[key];
                }
                );
            }
            document.getElementById('previous').addEventListener('click', () => {
                if (step > 0) {
                    step--;
                    render();
                }
            }
            );
            document.getElementById('next').addEventListener('click', () => {
                if (step < 3) {
                    step++;
                    render();
                }
            }
            );
            document.getElementById('play').addEventListener('click', () => {
                playing = !playing;
                render();
            }
            );
            document.getElementById('reset').addEventListener('click', () => {
                playing = false;
                step = 0;
                Object.keys(counts).forEach(key => counts[key] = 0);
                render();
            }
            );
            document.getElementById('light-toggle').addEventListener('click', () => {
                lightOn = !lightOn;
                render();
            }
            );
            document.getElementById('co2-toggle').addEventListener('click', () => {
                co2On = !co2On;
                render();
            }
            );
            let ticks = 0;
            setInterval( () => {
                if (blocked())
                    return;
                if (step === 0)
                    counts.oxygen++;
                if (step === 1) {
                    counts.atp++;
                    counts.nadph++;
                }
                if (step === 3)
                    counts.glucose++;
                ticks++;
                if (playing && ticks % 4 === 0)
                    step = (step + 1) % 4;
                render();
            }
            , 1000);
            render();
        </script>
    </body>
</html>
