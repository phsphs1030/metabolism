<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>광합성 전체 과정 애니메이션</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #071b2d;
    color: white;
    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    overflow: hidden;
}

/* ==========================
   전체 화면
========================== */

#app {
    width: 100vw;
    height: 100dvh;
    position: relative;
}

/* ==========================
   제목
========================== */

.title {
    position: absolute;

    top: 15px;
    left: 0;

    width: 100%;

    text-align: center;

    font-size: clamp(25px, 4vw, 42px);

    margin: 0;

    z-index: 20;
}

.subtitle {
    position: absolute;

    top: 62px;
    left: 0;

    width: 100%;

    text-align: center;

    font-size: clamp(13px, 1.8vw, 18px);

    color: #b9d9e8;

    z-index: 20;
}

/* ==========================
   메인 화면
========================== */

.scene {
    position: absolute;

    left: 50%;
    top: 54%;

    transform: translate(-50%, -50%);

    width: min(94vw, 1250px);
    height: min(74vh, 680px);

    border: 2px solid rgba(255,255,255,0.15);

    border-radius: 28px;

    background:
        radial-gradient(
            circle at center,
            rgba(35,100,130,0.18),
            rgba(0,0,0,0.15)
        );

    overflow: hidden;
}

/* ==========================
   왼쪽 영역
   빛 + 물 + 광계
========================== */

.left-area {
    position: absolute;

    left: 4%;
    top: 12%;

    width: 38%;
    height: 76%;
}

/* 엽록체 */
.chloroplast {
    position: absolute;

    left: 8%;
    top: 18%;

    width: 84%;
    height: 62%;

    border: 4px solid #65d991;

    border-radius: 50%;

    background: rgba(50,160,100,0.07);
}

/* 엽록체 글자 */
.chloroplast-label {
    position: absolute;

    top: 10px;

    width: 100%;

    text-align: center;

    color: #91e9b0;

    font-size: 15px;
}

/* 틸라코이드 */
.thylakoid {
    position: absolute;

    left: 12%;
    top: 35%;

    width: 76%;
    height: 30%;

    border: 3px solid #4fd38a;

    border-radius: 50px;

    background: rgba(40,150,100,0.1);
}

/* ==========================
   빛
========================== */

.sun {
    position: absolute;

    left: 0;
    top: 0;

    font-size: 50px;

    animation:
        glow 1.5s infinite alternate;
}

@keyframes glow {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.12);
    }
}

.light-ray {
    position: absolute;

    left: 8%;
    top: 13%;

    width: 130px;
    height: 4px;

    background: #ffe66d;

    box-shadow:
        0 0 12px #ffe66d;

    transform: rotate(22deg);

    animation: lightMove 3s infinite;
}

@keyframes lightMove {

    0% {
        left: 7%;
        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    70% {
        left: 22%;
        opacity: 1;
    }

    100% {
        left: 25%;
        opacity: 0;
    }
}

/* ==========================
   광계
========================== */

.ps {
    position: absolute;

    width: 68px;
    height: 52px;

    border-radius: 14px;

    background: rgba(50,210,110,0.18);

    border: 3px solid #64e49b;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    font-size: 12px;

    line-height: 1.25;

    z-index: 5;
}

.psii {
    left: 18%;
    top: 42%;
}

.psi {
    right: 18%;
    top: 42%;
}

/* ==========================
   물
========================== */

.water {
    position: absolute;

    left: 8%;
    bottom: 2%;

    padding: 7px 13px;

    border-radius: 10px;

    background: rgba(20,100,150,0.35);

    color: #82e6ff;

    font-size: 15px;

    animation: waterShow 12s infinite;
}

@keyframes waterShow {

    0%, 8% {
        opacity: 0;
    }

    12%, 28% {
        opacity: 1;
    }

    35%, 100% {
        opacity: 0;
    }
}

/* ==========================
   산소
========================== */

.oxygen {
    position: absolute;

    left: 27%;
    bottom: 2%;

    color: #91eaff;

    font-size: 18px;

    opacity: 0;

    animation: oxygenMove 12s infinite;
}

@keyframes oxygenMove {

    0%, 20% {
        opacity: 0;
        transform: translateY(0);
    }

    25% {
        opacity: 1;
    }

    45% {
        opacity: 0;
        transform: translateY(-60px);
    }

    100% {
        opacity: 0;
    }
}

/* ==========================
   오른쪽 영역
   전자전달 + ATP + NADPH
========================== */

.right-area {
    position: absolute;

    right: 4%;
    top: 12%;

    width: 51%;
    height: 76%;
}

/* ==========================
   전자 전달계
========================== */

.electron-system {
    position: absolute;

    left: 5%;
    top: 17%;

    width: 90%;
    height: 30%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}

/* 각 단계 */
.box {
    min-width: 85px;
    height: 60px;

    border: 2px solid #4f9bc5;

    border-radius: 15px;

    background: rgba(30,100,140,0.18);

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: 13px;

    line-height: 1.35;

    padding: 5px;
}

/* 화살표 */
.arrow {
    font-size: 25px;

    color: #70d6ff;

    flex-shrink: 0;
}

/* 전자 */
.electron {
    position: absolute;

    top: 40%;

    left: 0;

    color: #62caff;

    font-size: 24px;

    font-weight: bold;

    opacity: 0;

    animation: electronMove 12s infinite;
}

@keyframes electronMove {

    0%, 8% {
        left: 3%;
        opacity: 0;
    }

    12% {
        opacity: 1;
    }

    25% {
        left: 30%;
    }

    40% {
        left: 55%;
    }

    55% {
        left: 78%;
    }

    65% {
        left: 90%;
        opacity: 1;
    }

    70%, 100% {
        opacity: 0;
    }
}

/* ==========================
   H+
========================== */

.protons {
    position: absolute;

    left: 17%;
    top: 3%;

    width: 65%;

    display: flex;

    justify-content: space-around;

    opacity: 0;

    animation: protonAppear 12s infinite;
}

.proton {
    color: #ff9bea;

    font-size: 18px;

    animation:
        protonBounce 1.2s infinite alternate;
}

@keyframes protonAppear {

    0%, 20% {
        opacity: 0;
    }

    30%, 70% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

@keyframes protonBounce {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(8px);
    }
}

/* ==========================
   ATP 영역
========================== */

.atp-area {
    position: absolute;

    left: 5%;
    bottom: 3%;

    width: 43%;
    height: 35%;

    border-top: 2px dashed rgba(255,255,255,0.2);

    padding-top: 18px;
}

/* ATP 합성효소 */
.atp-synthase {
    position: absolute;

    left: 42%;
    top: 25%;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: #e8ca4d;

    border: 4px solid #fff0a0;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: 10px;

    animation: rotateATP 12s infinite;
}

@keyframes rotateATP {

    0%, 55% {
        transform: rotate(0deg);
    }

    65% {
        transform: rotate(180deg);
    }

    75% {
        transform: rotate(360deg);
    }

    100% {
        transform: rotate(360deg);
    }
}

/* H+ 흐름 */
.h-flow {
    position: absolute;

    left: 20%;
    top: 5%;

    color: #ff9bea;

    font-size: 18px;

    opacity: 0;

    animation: hFlow 12s infinite;
}

@keyframes hFlow {

    0%, 50% {
        opacity: 0;
    }

    58% {
        opacity: 1;
    }

    72% {
        transform: translateY(60px);
        opacity: 1;
    }

    80%, 100% {
        opacity: 0;
    }
}

/* ADP */
.adp {
    position: absolute;

    left: 5%;
    bottom: 15%;

    font-size: 14px;

    animation: adpHide 12s infinite;
}

@keyframes adpHide {

    0%, 68% {
        opacity: 1;
    }

    78%, 100% {
        opacity: 0;
    }
}

/* ATP */
.atp {
    position: absolute;

    right: 5%;
    bottom: 15%;

    color: #ffe66d;

    font-size: 22px;

    font-weight: bold;

    opacity: 0;

    animation: atpCreate 12s infinite;
}

@keyframes atpCreate {

    0%, 70% {
        opacity: 0;
        transform: scale(0.6);
    }

    78% {
        opacity: 1;
        transform: scale(1.1);
    }

    100% {
        opacity: 1;
        transform: scale(1);
        text-shadow: 0 0 18px #ffe66d;
    }
}

/* ==========================
   NADPH 영역
========================== */

.nadph-area {
    position: absolute;

    right: 0;
    bottom: 3%;

    width: 43%;
    height: 35%;

    border-top: 2px dashed rgba(255,255,255,0.2);

    padding-top: 18px;
}

.psi-label {
    text-align: center;

    color: #91e9b0;

    font-size: 13px;
}

.nadp {
    position: absolute;

    left: 5%;
    top: 42%;

    font-size: 14px;

    opacity: 0;

    animation: nadpShow 12s infinite;
}

@keyframes nadpShow {

    0%, 72% {
        opacity: 0;
    }

    80%, 100% {
        opacity: 1;
    }
}

.nadph {
    position: absolute;

    right: 5%;
    top: 42%;

    color: #7ee8ff;

    font-size: 21px;

    font-weight: bold;

    opacity: 0;

    animation: nadphCreate 12s infinite;
}

@keyframes nadphCreate {

    0%, 80% {
        opacity: 0;
        transform: scale(0.6);
    }

    88% {
        opacity: 1;
        transform: scale(1.1);
    }

    100% {
        opacity: 1;
        transform: scale(1);
        text-shadow: 0 0 18px #7ee8ff;
    }
}

/* ==========================
   최종 결과
========================== */

.final {
    position: absolute;

    left: 50%;
    bottom: 4%;

    transform: translateX(-50%);

    display: flex;

    gap: 18px;

    opacity: 0;

    animation: finalShow 12s infinite;
}

.final-item {
    min-width: 105px;

    padding: 9px 15px;

    border-radius: 12px;

    background: rgba(255,255,255,0.07);

    border: 1px solid rgba(255,255,255,0.25);

    text-align: center;

    font-size: 13px;
}

.final-item strong {
    display: block;

    font-size: 20px;

    margin-bottom: 3px;
}

@keyframes finalShow {

    0%, 85% {
        opacity: 0;
    }

    92%, 100% {
        opacity: 1;
    }
}

/* ==========================
   설명
========================== */

.description {
    position: absolute;

    left: 50%;
    bottom: 15px;

    transform: translateX(-50%);

    width: min(85vw, 850px);

    min-height: 45px;

    padding: 10px 20px;

    border-radius: 14px;

    background: rgba(0,0,0,0.65);

    text-align: center;

    font-size: clamp(12px, 1.5vw, 16px);

    line-height: 1.5;

    z-index: 30;

    white-space: nowrap;
}

/* 다시 시작 */
.restart {
    position: absolute;

    right: 20px;
    top: 15px;

    padding: 8px 13px;

    border: none;

    border-radius: 9px;

    background: #1e4d69;

    color: white;

    cursor: pointer;

    z-index: 40;
}

/* ==========================
   작은 화면
========================== */

@media (max-width: 750px) {

    .scene {
        height: 77vh;
        width: 96vw;
    }

    .left-area {
        left: 3%;
        width: 42%;
    }

    .right-area {
        right: 3%;
        width: 50%;
    }

    .box {
        min-width: 60px;
        height: 48px;

        font-size: 10px;
    }

    .arrow {
        font-size: 16px;
    }

    .atp-area,
    .nadph-area {
        width: 48%;
    }

    .final {
        gap: 5px;
    }

    .final-item {
        min-width: 75px;

        padding: 7px 5px;

        font-size: 10px;
    }

    .final-item strong {
        font-size: 15px;
    }

    .description {
        width: 90vw;

        white-space: normal;

        bottom: 8px;
    }

    .restart {
        top: 10px;
        right: 10px;
        font-size: 11px;
    }
}

</style>
</head>


<body>

<div id="app">

<h1 class="title">
    광합성의 전체 과정
</h1>

<div class="subtitle">
    빛에너지가 ATP와 NADPH로 전환되는 명반응
</div>


<div class="scene">

<!-- ==================================
     왼쪽 : 광합성 시작
================================== -->

<div class="left-area">

    <!-- 태양 -->
    <div class="sun">
        ☀️
    </div>

    <!-- 빛 -->
    <div class="light-ray"></div>

    <!-- 엽록체 -->
    <div class="chloroplast">

        <div class="chloroplast-label">
            엽록체
        </div>

        <!-- 틸라코이드 -->
        <div class="thylakoid">

            <!-- 광계 II -->
            <div class="ps psii">
                광계 II<br>
                PSII
            </div>

            <!-- 광계 I -->
            <div class="ps psi">
                광계 I<br>
                PSI
            </div>

        </div>

    </div>


    <!-- 물 -->
    <div class="water">
        H₂O → H⁺ + e⁻ + O₂
    </div>

    <!-- 산소 -->
    <div class="oxygen">
        O₂ ↑
    </div>

</div>


<!-- ==================================
     오른쪽 : 전자전달 + ATP + NADPH
================================== -->

<div class="right-area">

    <!-- 전자 전달계 -->
    <div class="electron-system">

        <div class="box">
            광계 II
        </div>

        <div class="arrow">
            →
        </div>

        <div class="box">
            전자전달계
        </div>

        <div class="arrow">
            →
        </div>

        <div class="box">
            광계 I
        </div>

    </div>


    <!-- 전자 -->
    <div class="electron">
        e⁻
    </div>


    <!-- H+ -->
    <div class="protons">

        <div class="proton">
            H⁺
        </div>

        <div class="proton">
            H⁺
        </div>

        <div class="proton">
            H⁺
        </div>

        <div class="proton">
            H⁺
        </div>

        <div class="proton">
            H⁺
        </div>

    </div>


    <!-- ATP 영역 -->
    <div class="atp-area">

        <div class="h-flow">
            H⁺ ↓
        </div>

        <div class="atp-synthase">
            ATP<br>
            합성효소
        </div>

        <div class="adp">
            ADP + Pi
        </div>

        <div class="atp">
            ⚡ ATP
        </div>

    </div>


    <!-- NADPH 영역 -->
    <div class="nadph-area">

        <div class="psi-label">
            광계 I에서 전자 재충전
        </div>

        <div class="nadp">
            NADP⁺ + H⁺
        </div>

        <div class="nadph">
            🔋 NADPH
        </div>

    </div>

</div>


<!-- 최종 결과 -->
<div class="final">

    <div class="final-item">
        <strong>ATP</strong>
        에너지
    </div>

    <div class="final-item">
        <strong>NADPH</strong>
        환원력
    </div>

    <div class="final-item">
        <strong>O₂</strong>
        방출
    </div>

</div>

</div>


<!-- 설명 -->
<div class="description" id="description">
    ① 엽록소가 빛에너지를 흡수하면서 광합성이 시작됩니다.
</div>


<button class="restart" onclick="restart()">
    ↻ 다시 시작
</button>


</div>


<script>

const descriptions = [

    "① 빛 흡수 — 엽록소가 빛에너지를 흡수합니다.",

    "② 물의 광분해 — 물이 분해되어 전자와 H⁺가 생성되고 산소가 방출됩니다.",

    "③ 전자 전달 — 전자가 전자전달계를 따라 이동합니다.",

    "④ H⁺ 농도차 형성 — 전자의 에너지로 H⁺가 틸라코이드 내부에 축적됩니다.",

    "⑤ ATP 생성 — H⁺가 ATP 합성효소를 통과하면서 ATP가 만들어집니다.",

    "⑥ NADPH 생성 — 광계 I에서 다시 에너지를 얻은 전자가 NADP⁺에 전달됩니다.",

    "⑦ 최종 결과 — ATP와 NADPH가 생성되고 산소가 방출됩니다."

];

let i = 0;

function updateDescription() {

    document.getElementById("description").textContent =
        descriptions[i];

    i++;

    if (i >= descriptions.length) {
        i = 0;
    }
}

/* 약 1.7초마다 현재 단계 설명 변경 */
setInterval(updateDescription, 1700);


/* 다시 시작 */
function restart() {

    location.reload();

}

</script>

</body>
</html>
