<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CELLULAR RESPIRATION</title>
<style>
:root{--panel:#0e1730;--line:#223260;--tx:#e8f1ff;--dim:#8ea3cf;--ac:#4dd0ff;--gold:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#10224a,#060b1a 60%);color:var(--tx);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh;padding-bottom:30px}
header{padding:14px 12px 8px;text-align:center}
h1{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:.18em;background:linear-gradient(90deg,#4dd0ff,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:2px 0 10px;color:var(--dim);font-size:14px}
#chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{padding:8px 12px;border:1px solid var(--line);border-radius:20px;font-size:13px;color:var(--dim);background:#0a1226;min-height:38px;cursor:pointer}
.chip.on{color:#06101f;background:var(--ac);border-color:var(--ac);font-weight:700}
.pr{max-width:900px;margin:10px auto 0;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
.bar{flex:1;height:10px;border-radius:6px;background:#12203f;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4dd0ff,#ffd23f)}
#where{margin-top:8px;font-size:14px;color:#ffd9a0}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:0 12px;max-width:1500px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
.cv{border:1px solid var(--line);border-radius:14px;overflow-x:auto;background:#060b1a}
canvas{display:block;width:100%;min-width:640px;aspect-ratio:1000/620;touch-action:manipulation}
aside,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
aside h2{margin:0 0 4px;font-size:20px}
.loc{color:#ffd9a0;font-size:13px;margin-bottom:8px}
aside p{margin:0;font-size:14px;line-height:1.6;color:#cfd8ff}
#cap{margin:10px 0;padding:10px;border-left:4px solid var(--ac);background:#0a1530;border-radius:8px;font-weight:600;font-size:14px;min-height:46px}
.sum{opacity:.45;transition:.4s;font-size:13.5px;line-height:1.6;color:#dbe6ff}
.sum.on{opacity:1}
.sum b{color:var(--gold)}
.sum div{margin-top:6px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:1500px;margin:12px auto;padding:0 12px}
button{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#12203f;color:var(--tx);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
button:active{transform:scale(.97)}
button.sp.on{background:var(--ac);color:#06101f;border-color:var(--ac)}
.ctl label{font-size:14px;color:#ffb3b3;display:flex;align-items:center;gap:6px;min-height:46px}
.ctl input[type=checkbox]{width:22px;height:22px}
#tl{width:min(100%,520px);height:34px}
.bt{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px;padding:0 12px;max-width:1500px;margin:0 auto}
@media(max-width:760px){.bt{grid-template-columns:1fr}}
.atp{text-align:center}
.lb{font-size:13px;color:var(--dim)}
#atpN{font-size:64px;font-weight:900;color:var(--gold);text-shadow:0 0 22px #ffd23f88;line-height:1.1}
#atpS,#atpS2{font-size:13px;color:#cfd8ff;margin-top:4px;line-height:1.5}
#stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.st{background:#0a1530;border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;min-height:70px}
.st small{display:block;color:#cfd8ff;font-size:13px;font-weight:700}
.st b{font-size:24px;color:var(--ac)}
.st em{display:block;font-style:normal;font-size:11px;color:var(--dim)}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000b;z-index:9;padding:16px}
#pop.on{display:flex}
.box{background:#101c3d;border:1px solid var(--ac);border-radius:16px;padding:20px;max-width:420px;width:100%}
.box h3{margin:0 0 8px;color:var(--gold)}
.box p{margin:0 0 14px;line-height:1.7;font-size:15px}
</style>
</head>
<body>
<header>
  <h1>CELLULAR RESPIRATION</h1>
  <div class="sub">세포호흡의 에너지 전환 시뮬레이션</div>
  <div id="chips"></div>
  <div class="pr"><span>전체 진행률</span><div class="bar"><i id="prog"></i></div><b id="pct">0%</b></div>
  <div id="where"></div>
</header>
<main>
  <div class="cv"><canvas id="c"></canvas></div>
  <aside>
    <h2 id="sname"></h2>
    <div id="sloc" class="loc"></div>
    <p id="sdesc"></p>
    <div id="cap"></div>
    <div id="sum" class="sum"></div>
  </aside>
</main>
<div class="ctl">
  <button id="bPrev">⏮ 이전 단계</button>
  <button id="bNext">다음 단계 ⏭</button>
  <button id="bAuto">⏩ 전체 과정 재생</button>
  <button id="bPause">⏸ 일시정지</button>
  <button id="bReset">↺ 다시 시작</button>
  <button class="sp" data-s="0.5">느리게</button>
  <button class="sp on" data-s="1">보통</button>
  <button class="sp" data-s="2">빠르게</button>
  <label><input type="checkbox" id="hyp"> 산소 부족 실험 (4단계)</label>
  <input type="range" id="tl" min="0" max="1000" value="0">
</div>
<section class="bt">
  <div class="card atp">
    <div class="lb">현재까지 생성된 ATP (순)</div>
    <div id="atpN">0</div>
    <div id="atpS"></div>
    <div id="atpS2"></div>
  </div>
  <div class="card"><div id="stats"></div></div>
</section>
<div id="pop"><div class="box"><h3 id="pt"></h3><p id="pd"></p><button id="px">닫기</button></div></div>

<script>
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const lerp=(a,b,u)=>a+(b-a)*u;
const ev=(x,n)=>Math.floor(x*n+1e-6);
const C=$('c'),X=C.getContext('2d'),W=1000,H=620;
const COL={c:'#ff9f43',pi:'#f7e463',atp:'#ffd23f',adp:'#d4a72c',nadh:'#4dd0ff',nad:'#2a88a8',fadh:'#b388ff',fad:'#7a56c2',co2:'#9aa5b1',e:'#c8ffff',h:'#ff5c7a',o2:'#ff4d4d',h2o:'#54a0ff',coa:'#2ed573'};

/* ---------- 정보 팝업 ---------- */
const INFO={
glucose:['포도당 (C₆H₁₂O₆)','6탄소 화합물로 세포호흡의 시작 물질입니다. 단계적으로 분해되며 화학 에너지의 일부가 ATP로 전환됩니다.'],
pyruvate:['피루브산','해당 과정에서 생성되는 3탄소 화합물입니다. 산소가 있으면 마이토콘드리아 바탕질로 이동해 산화됩니다.'],
acoa:['아세틸조효소 A','TCA 회로에 투입되는 2탄소 화합물(아세틸기 + 조효소 A)입니다.'],
coa:['조효소 A (CoA)','2탄소 아세틸기와 결합하여 아세틸조효소 A를 만드는 조효소입니다.'],
co2:['이산화탄소 (CO₂)','탄소 화합물이 산화될 때 방출됩니다. 피루브산 산화와 TCA 회로에서 생성되며, 포도당의 탄소 6개는 모두 CO₂ 6분자가 됩니다.'],
atp:['ATP','아데노신에 인산기 3개가 연결된 세포의 에너지 화폐입니다. 인산 결합이 끊어질 때 에너지가 방출되어 생명 활동에 쓰입니다.'],
adp:['ADP','인산기가 2개인 분자입니다. ADP + Pi → ATP 반응으로 에너지가 저장됩니다. (칩의 수치는 ATP 합성에 사용된 ADP 수)'],
pi:['무기인산 (Pi)','ADP와 결합하여 ATP를 만드는 인산기입니다. 기질수준인산화에서는 기질에 붙어 있던 인산기가 ADP로 전달됩니다.'],
nad:['NAD⁺','전자와 수소를 받아 NADH로 환원되는 조효소입니다. 전자전달계에서 NADH가 산화되면 NAD⁺가 재생됩니다. (칩의 수치는 재생된 수)'],
nadh:['NADH','고에너지 전자를 운반하는 조효소입니다. 해당 과정, 피루브산 산화, TCA 회로에서 생성되어 전자를 전자전달계로 전달합니다.'],
fad:['FAD','전자와 수소를 받아 FADH₂로 환원되는 조효소입니다. (칩의 수치는 재생된 수)'],
fadh2:['FADH₂','전자를 전자전달계로 전달하는 조효소입니다. TCA 회로에서 생성되며 복합체 Ⅱ에 전자를 전달하고 FAD로 산화됩니다.'],
o2:['산소 (O₂)','전자전달계의 최종 전자 수용체입니다. 산소가 부족하면 전자 흐름이 막혀 산화적 인산화가 정상적으로 진행되지 않습니다.'],
h2o:['물 (H₂O)','산소가 전자와 수소 이온(H⁺)을 받아 생성됩니다.'],
hplus:['수소 이온 (H⁺)','전자의 에너지로 바탕질에서 막사이공간으로 능동수송되어 농도 기울기를 만듭니다. 이 기울기를 따라 ATP 합성효소를 통과하며 ATP가 합성됩니다.'],
e:['전자 (e⁻)','NADH·FADH₂에서 나와 전자전달계의 전자운반체를 차례로 거쳐 산소에 전달됩니다. 이동하며 방출한 에너지로 H⁺를 능동수송합니다.'],
synthase:['ATP 합성효소','내막에 있는 회전형 단백질입니다. H⁺가 농도 기울기를 따라 통과할 때 회전하면서 ADP와 Pi를 결합해 ATP를 합성합니다(화학삼투).'],
etc:['전자전달계 (복합체 Ⅰ~Ⅳ)','마이토콘드리아 내막에 있는 단백질 복합체들입니다. 전자가 이동하며 방출한 에너지로 H⁺를 바탕질에서 막사이공간으로 능동수송합니다.'],
carrier:['전자운반체 (Q, 시토크롬 c)','복합체 사이에서 전자를 전달하는 운반체입니다.'],
cellmem:['세포막','세포를 둘러싸고 물질의 출입을 조절하는 막입니다.'],
cyto:['세포질','해당 과정이 일어나는 곳입니다. 포도당 1분자가 피루브산 2분자로 분해됩니다.'],
outer:['마이토콘드리아 외막','마이토콘드리아를 둘러싼 바깥쪽 막입니다.'],
cristae:['크리스타','내막이 안쪽으로 주름진 구조입니다. 표면적이 넓어 전자전달계와 ATP 합성효소가 많이 들어갈 수 있습니다.'],
ims:['막사이공간','외막과 내막 사이 공간입니다. 산화적 인산화에서 H⁺가 축적되어 농도가 높아집니다.'],
inner:['마이토콘드리아 내막','전자전달계와 ATP 합성효소가 있는 막입니다. 산화적 인산화가 일어납니다.'],
matrix:['바탕질','마이토콘드리아 내부 공간입니다. 피루브산 산화와 TCA 회로가 일어납니다.'],
oaa:['옥살아세트산 (4탄소)','아세틸기(2C)와 결합해 시트르산(6C)을 만들고, 회로 끝에서 다시 재생됩니다.'],
citrate:['시트르산 (6탄소)','아세틸기와 옥살아세트산이 결합해 생성됩니다. 이후 CO₂를 방출하며 탄소 수가 줄어듭니다.'],
c5:['5탄소 화합물','시트르산이 탈탄산(CO₂ 방출)되고 NADH가 생성된 뒤 만들어집니다.'],
c4:['4탄소 화합물','두 번째 탈탄산 이후의 중간 산물입니다. 이후 ATP, FADH₂, NADH가 생성되며 옥살아세트산이 재생됩니다.'],
trans:['피루브산 수송 단백질','피루브산이 막을 통과해 마이토콘드리아 바탕질로 들어가도록 돕습니다.']
};

/* ---------- 단계 데이터 ---------- */
const DUR=[8,22,15,24,28,12];
const TC=['아세틸기(C₂) + 옥살아세트산(C₄) → 시트르산(C₆)','탈탄산: CO₂ 방출 + NADH 생성 (C₆ → C₅)','탈탄산: CO₂ 방출 + NADH + ATP 생성 (C₅ → C₄)','FADH₂ 생성 (C₄ → C₄)','NADH 생성 → 옥살아세트산(C₄) 재생'];
const STAGES=[
{n:'세포 구조',loc:'세포 전체',w:'세포 안으로 들어온 포도당(C₆)',d:'세포막 안에 마이토콘드리아가 있습니다. 해당 과정은 세포질에서, 나머지 세 단계는 마이토콘드리아에서 일어납니다. 구조를 터치하면 설명이 나옵니다.',
 cap:[[0,'포도당이 세포 안으로 들어옵니다 (세포질)'],[.25,'피루브산이 마이토콘드리아 바탕질로 이동합니다'],[.5,'바탕질에서 피루브산 산화와 TCA 회로가 일어납니다'],[.75,'NADH·FADH₂의 전자가 내막의 전자전달계로 전달됩니다']],
 s:'세포호흡 = <b>해당 과정</b>(세포질) → <b>피루브산 산화</b>(바탕질) → <b>TCA 회로</b>(바탕질) → <b>산화적 인산화</b>(내막)',q:[]},
{n:'1단계 · 해당 과정',loc:'위치: 세포질 (세포질 강조)',w:'세포질 · 6탄소 포도당 → 3탄소 피루브산 2분자',d:'포도당 1분자가 피루브산 2분자로 분해됩니다. 산소를 직접 사용하지 않고, 이산화탄소도 생성되지 않습니다.',
 cap:[[0,'포도당 1분자 (6탄소 화합물)'],[.08,'ATP 2분자 소비 → 포도당 활성화'],[.32,'6탄소 화합물이 3탄소 화합물 2개로 분해'],[.5,'기질수준인산화: 기질의 인산기가 ADP로 전달 → ATP 4분자 생성, NADH 2분자 생성'],[.9,'피루브산 2 · NADH 2 · ATP 4 생성 − 2 소비 = 순생성 2']],
 s:'<b>해당 과정</b>: 세포질 · 산소 직접 사용 안 함 · 포도당 1 → 피루브산 2 · NADH 2 · ATP 순생성 2(4−2) · CO₂ 없음 · <b>기질수준인산화</b>',
 q:['Q. 포도당은 왜 피루브산으로 분해될까? → 큰 분자를 3탄소 화합물로 나누어 산소 없이도 ATP를 얻고, 이후 단계에서 산화될 수 있는 형태로 만들기 위해서입니다.','Q. ATP는 왜 먼저 소비될까? → 포도당을 활성화(인산화)해야 분해가 진행됩니다. 2분자를 투자하고 4분자를 얻어 순생성은 2분자입니다.']},
{n:'2단계 · 피루브산의 산화',loc:'위치: 마이토콘드리아 바탕질 (바탕질 강조)',w:'마이토콘드리아 바탕질 · 피루브산 → 아세틸 CoA',d:'피루브산이 바탕질로 이동해 산화되면서 CO₂가 방출되고 NADH가 생성되며, 남은 2탄소 화합물이 조효소 A와 결합합니다.',
 cap:[[0,'① 피루브산이 마이토콘드리아 바탕질로 이동'],[.3,'② 탄소 1개가 CO₂로 방출'],[.45,'③ NAD⁺가 전자·수소를 받아 NADH로 환원'],[.65,'④⑤ 2탄소 화합물이 조효소 A와 결합 → 아세틸 CoA'],[.95,'결과: 아세틸 CoA 2 · CO₂ 2 · NADH 2 · ATP 생성 없음']],
 s:'<b>피루브산 산화</b>: 바탕질 · 피루브산 1분자당 CO₂ 1 + NADH 1 + 아세틸 CoA 1 · 포도당 기준 아세틸 CoA 2, CO₂ 2, NADH 2, ATP 0',
 q:['Q. NADH는 어떤 역할을 할까? → 산화 반응에서 떼어 낸 고에너지 전자를 받아 전자전달계까지 운반합니다.']},

function cnt(){
 const r=s=>stage>s?1:stage===s?t:0;
 const g=r(1),q=r(2),c=r(3);
 const used=ev(seg(g,.1,.3),2),gross=ev(seg(g,.6,.86),4),gN=ev(seg(g,.5,.62),2),pyP=ev(seg(g,.84,.9),2);
 const pN=ev(seg(q,.35,.8),2),pCO=ev(seg(q,.25,.8),2),aP=ev(seg(q,.45,.95),2),pyU=ev(seg(q,.2,.7),2);
 const tCO=ev(c,4),tN=ev(c,6),tF=ev(c,2),tA=ev(c,2),aU=stage>3?2:stage===3?Math.ceil(c*2-1e-6):0;
 let pe=stage>4?1:stage===4?seg(t,.05,.62):0,pa=stage>4?1:stage===4?seg(t,.58,1):0;
 if(hyp){pe=Math.min(pe,.15);pa=Math.min(pa,.06);}
 const pump=(stage>4?1:stage===4?seg(t,.12,.7):0)*(hyp?.12:1);
 const oN=ev(pe,10),oF=ev(pe,2),oE=ev(pe,24),oO=ev(pe,6),oA=ev(pa,28),nadP=gN+pN+tN;
 return{glu:1-ev(seg(g,.3,.5),1),pyr:pyP-pyU,acoa:aP-aU,co2:pCO+tCO,atp:gross-used+tA+oA,sub:gross-used+tA,ox:oA,adp:gross+tA+oA,
  nadR:oN,nadh:nadP-oN,fadR:oF,fadh:tF-oF,o2:oO,h2o:oO,h:Math.round(pump*100),e:oE,used,gross,pump,nadAll:nadP,fadAll:tF};
}

const hs=(k,x,y,r)=>hot.push({k,x,y,r});

function txt(s,x,y,sz=18,col='#e8f1ff',al='center',w='600'){X.font=`${w} ${sz}px "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif`;X.textAlign=al;X.textBaseline='middle';X.fillStyle=col;X.fillText(s,x,y);}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function orb(x,y,r,col,lab,key,a=1){
 if(a<=.02)return;
 X.save();X.globalAlpha*=a;X.shadowColor=col;X.shadowBlur=r*1.2;
 X.beginPath();X.arc(x,y,r,0,7);X.fillStyle=col;X.fill();X.shadowBlur=0;
 const g=X.createRadialGradient(x-r*.35,y-r*.4,r*.05,x,y,r);
 g.addColorStop(0,'rgba(255,255,255,.8)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.35)');
 X.fillStyle=g;X.fill();
 if(lab)txt(lab,x,y+1,lab.length>2?Math.max(9,r*.6):Math.max(9,r*.95),'#07101f','center','800');
 X.restore();
 if(key)hs(key,x,y,r+6);
}
function nuc(x,y,n,a,key,col){
 if(a<=.02)return;
 X.save();X.globalAlpha*=a;
 orb(x,y,13,col,'A',null);
 for(let i=0;i<n;i++)orb(x+24+i*19,y,8,COL.pi,'P',null);
 txt(n===3?'ATP':n===2?'ADP':'AMP',x+12+n*9,y-23,13,col,'center','700');
 X.restore();
 hs(key,x+10+n*9,y,28);
}
function arrow(x1,y1,x2,y2,col,lw=3){
 X.save();X.strokeStyle=col;X.fillStyle=col;X.lineWidth=lw;X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();
 const a=Math.atan2(y2-y1,x2-x1);X.beginPath();X.moveTo(x2,y2);
 X.lineTo(x2-11*Math.cos(a-.4),y2-11*Math.sin(a-.4));X.lineTo(x2-11*Math.cos(a+.4),y2-11*Math.sin(a+.4));X.closePath();X.fill();X.restore();
}
function cluster(n,x,y,a=1,key){
 const R=n>4?23:n>2?17:10,pts=[];
 for(let i=0;i<n;i++){const an=i/n*6.2832-1.57;pts.push([x+R*Math.cos(an),y+R*Math.sin(an)]);}
 X.save();X.globalAlpha*=a;X.strokeStyle='rgba(255,200,140,.8)';X.lineWidth=4;X.beginPath();
 pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));if(n>2)X.closePath();X.stroke();X.restore();
 pts.forEach(p=>orb(p[0],p[1],12,COL.c,'C',null,a));
 if(key)hs(key,x,y,R+16);
}

function poly(P,u){
 const L=[];let T=0;
 for(let i=1;i<P.length;i++){const l=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);L.push(l);T+=l;}
 let d=u*T;
 for(let i=0;i<L.length;i++){if(d<=L[i]){const f=d/L[i];return[lerp(P[i][0],P[i+1][0],f),lerp(P[i][1],P[i+1][1],f)];}d-=L[i];}
 return P[P.length-1];
}

 X.fillStyle='rgba(120,180,255,.25)';
 for(let i=0;i<50;i++){X.beginPath();X.arc((i*137.5)%W+12*Math.sin(amb*.5+i),(i*83.3)%H+10*Math.cos(amb*.4+i*1.3),1+i%3,0,7);X.fill();}
}

function innerPath(rx,ry){
 X.beginPath();
 for(let i=0;i<=240;i++){
  const a=i/240*6.2832,f=1-.55*Math.exp(-Math.pow(Math.sin(5*a)/.15,2))*clamp((Math.abs(Math.sin(a))-.35)*4);
  const x=rx*.8*Math.cos(a)*f,y=ry*.8*Math.sin(a)*f;
  i?X.lineTo(x,y):X.moveTo(x,y);
 }
 X.closePath();
}
function mito(rx,ry,hl,p){

 X.lineWidth=8;X.strokeStyle='#ff7a5c';X.shadowColor='#ff7a5c';X.shadowBlur=hl==='outer'?24:8;X.stroke();X.shadowBlur=0;
 innerPath(rx,ry);
 X.fillStyle=hl==='matrix'?`rgba(200,110,255,${.4+.25*p})`:'rgba(120,60,150,.5)';X.fill();
 X.lineWidth=5;X.strokeStyle='#ffc27a';X.shadowColor='#ffc27a';X.shadowBlur=hl==='inner'?26*p+4:4;X.stroke();X.shadowBlur=0;

 [['세포막',-290,-180,-243,-225,'cellmem'],['세포질',-250,40,null,null,'cyto'],['마이토콘드리아 외막',250,-165,284,-44,'outer'],
  ['크리스타(내막의 주름)',40,-150,129,-6,'cristae'],['막사이공간',150,190,150,125,'ims'],['내막',340,118,282,72,'inner'],['바탕질',150,30,null,null,'matrix']]
 .forEach(([n,x,y,ax,ay,k])=>{

  txt(n,a[0],a[1],16,'#fff');hs(k,a[0],a[1],46);

function overview(t){

function gly(t){
 X.fillStyle='rgba(255,159,67,.07)';X.fillRect(0,0,W,H);
 txt('세포질 — 해당 과정',20,26,22,'#ffb86b','left','800');
 const ap=ease(seg(t,0,.08)),sp=ease(seg(t,.32,.5)),mv=ease(seg(t,.9,1));
 const gx=lerp(300,520,sp)+80*mv,dy=110*sp;
 const ctr=g=>[gx,320+(g?1:-1)*dy];
 const bp=k=>{
  const g=k>=3?0:1,c=ctr(g),i=k%3,a=(i*120-90)*Math.PI/180;
  const rx=300+44*Math.cos(k*Math.PI/3),ry=320+44*Math.sin(k*Math.PI/3);
  return[lerp(rx,c[0]+24*Math.cos(a),sp),lerp(ry,c[1]+24*Math.sin(a),sp)];
 };
 const bond=(k1,k2,a)=>{const p=bp(k1),q=bp(k2);X.save();X.globalAlpha*=a*ap;X.strokeStyle='rgba(255,200,140,.8)';X.lineWidth=4;X.beginPath();X.moveTo(p[0],p[1]);X.lineTo(q[0],q[1]);X.stroke();X.restore();};
 [[0,1,1],[1,2,1],[3,4,1],[4,5,1],[2,3,1-sp],[5,0,1-sp],[0,2,sp],[3,5,sp]].forEach(b=>bond(b[0],b[1],b[2]));
 for(let k=0;k<6;k++){const p=bp(k);orb(p[0],p[1],14,COL.c,'C',null,ap);}
 if(sp<.5){hs('glucose',300,320,62);if(t<.32)txt('포도당 (C₆)',300,384,17,COL.c);}
 else{hs('pyruvate',ctr(0)[0],ctr(0)[1],48);hs('pyruvate',ctr(1)[0],ctr(1)[1],48);}
 for(let k=0;k<2;k++){
  const sg=k?1:-1,a=.1+k*.08,S=[50,k?560:80],N=[130,320+sg*80];
  const e1=ease(seg(t,a,a+.06)),e2=ease(seg(t,a+.06,a+.1)),e3=seg(t,a+.1,a+.16);
  const bd=bp(k?1:4),att=[bd[0]+(k?18:-18),bd[1]+sg*26],c=ctr(k);
  const cp1=[c[0]-30,c[1]+sg*30],cp2=[c[0]+30,c[1]+sg*30];
  const near=[c[0]+90,c[1]-sg*42],slot=[near[0]+62,near[1]],St=[c[0]+300,320];
  /* ATP 소비 */
  if(t>=a&&t<a+.06)nuc(lerp(S[0],N[0],e1),lerp(S[1],N[1],e1),3,1,'atp',COL.atp);
  else if(t>=a+.06&&t<a+.16)nuc(N[0],N[1],2,1-e3,'adp',COL.adp);
  if(t>=a+.06){
   const from=[N[0]+62,N[1]];
   let pp=e2<1?[lerp(from[0],att[0],e2),lerp(from[1],att[1],e2)]:[lerp(att[0],cp1[0],sp),lerp(att[1],cp1[1],sp)];
   const u1=seg(t,.74,.86);
   if(t>=.74){const q=ease(seg(u1,.35,.6));pp=[lerp(cp1[0],slot[0],q),lerp(cp1[1],slot[1],q)];}
   if(u1<.6)orb(pp[0],pp[1],9,COL.pi,'P','pi');
  }
  /* 무기인산 + NAD⁺ → NADH */
  if(t>=.5){
   const pe=ease(seg(t,.5,.58)),u0=seg(t,.6,.72);
   if(u0<.6){
    const q=ease(seg(u0,.35,.6));
    const pp=t<.58?[lerp(c[0]+170,cp2[0],pe),lerp(c[1]+sg*100,cp2[1],pe)]:[lerp(cp2[0],slot[0],q),lerp(cp2[1],slot[1],q)];
    orb(pp[0],pp[1],9,COL.pi,'P','pi');
   }
   const nn=[c[0],c[1]+sg*72],pool=[880,320+sg*70],n1=ease(seg(t,.5,.56)),n2=ease(seg(t,.58,.7));
   const np=t<.58?[lerp(c[0]+220,nn[0],n1),lerp(c[1]+sg*140,nn[1],n1)]:[lerp(nn[0],pool[0],n2),lerp(nn[1],pool[1],n2)];
   if(t<.56)orb(np[0],np[1],17,COL.nad,'NAD⁺','nad');else orb(np[0],np[1],17,COL.nadh,'NADH','nadh');
  }
  /* 기질수준인산화: ADP + Pi → ATP */
  for(let m=0;m<2;m++){
   const w0=.6+m*.14;if(t<w0)continue;
   const u=seg(t,w0,w0+.12),e1b=ease(seg(u,0,.35)),e3b=ease(seg(u,.6,1)),pool=[520+m*130,k?560:75];
   const P=u<.6?[lerp(St[0],near[0],e1b),lerp(St[1],near[1],e1b)]:[lerp(near[0],pool[0],e3b),lerp(near[1],pool[1],e3b)];
   nuc(P[0],P[1],u<.6?2:3,Math.min(1,u*8),u<.6?'adp':'atp',u<.6?COL.adp:COL.atp);
  }
  if(t>=.86)txt('피루브산 (C₃)',c[0],c[1]+sg*58,16,COL.c);
 }
 if(t>=.7)txt('NADH 2',880,320,15,COL.nadh);

 ui();
}
const STATS=[['glucose','포도당','glu','남은 수'],['pyruvate','피루브산','pyr','현재'],['acoa','아세틸 CoA','acoa','현재'],['co2','CO₂','co2','누적 생성'],['atp','ATP','atp','순 누적'],['adp','ADP','adp','합성에 사용'],['nad','NAD⁺','nadR','재생(산화)'],['nadh','NADH','nadh','현재 보유'],['fad','FAD','fadR','재생(산화)'],['fadh2','FADH₂','fadh','현재 보유'],['o2','O₂','o2','소비'],['h2o','H₂O','h2o','생성'],['hplus','H⁺ 기울기','h','막사이공간 %'],['e','전자 e⁻','e','전달된 수']];
let vals=[];
function ui(){
 const tot=DUR.reduce((a,b)=>a+b,0);let cum=0;for(let i=0;i<stage;i++)cum+=DUR[i];
 const pr=(cum+t*DUR[stage])/tot;
 $('prog').style.width=pr*100+'%';$('pct').textContent=Math.round(pr*100)+'%';
 $('where').textContent='🔬 포도당 1분자 현재 위치: '+STAGES[stage].w;
 $('cap').textContent=capText();
 $('sum').classList.toggle('on',t>=.93);
 if(document.activeElement!==$('tl'))$('tl').value=Math.round(t*1000);
 shownATP+=(K.atp-shownATP)*.2;if(Math.abs(K.atp-shownATP)<.05)shownATP=K.atp;
 const an=$('atpN');an.textContent=Math.round(shownATP);an.style.color=K.atp<0?'#ff7b7b':'';
 $('atpS').textContent=`기질수준인산화 ${K.sub} · 산화적 인산화 ${K.ox}`;
 $('atpS2').textContent=`NADH 생성 ${K.nadAll} · FADH₂ 생성 ${K.fadAll} · CO₂ ${K.co2} · O₂ 소비 ${K.o2}`;
 STATS.forEach((s,i)=>{vals[i].textContent=K[s[2]]+(s[2]==='h'?'%':'');});
}
function updateInfo(){
 const s=STAGES[stage];
 $('sname').textContent=s.n;$('sloc').textContent=s.loc;$('sdesc').textContent=s.d;
 $('sum').innerHTML='<b>핵심 정리</b><div>'+s.s+'</div>'+s.q.map(q=>'<div>'+q+'</div>').join('');
 document.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('on',i===stage));
 syncBtn();
}
function syncBtn(){$('bPause').textContent=playing?'⏸ 일시정지':'▶ 계속';}
function go(s,a){stage=s;t=0;zt=0;playing=true;auto=!!a;updateInfo();}

/* ---------- 루프 ---------- */
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;amb+=dt;zt+=dt;dtS=0;
 if(playing){
  dtS=dt*spd;clk+=dtS;t+=dtS/DUR[stage];
  if(stage===4&&K)rot+=dtS*K.pump*10;
  if(t>=1){t=1;if(auto&&stage<5)go(stage+1,true);else{playing=false;auto=false;syncBtn();}}
 }
 render();requestAnimationFrame(loop);
}

/* ---------- 이벤트 ---------- */
function pop(k){const i=INFO[k];if(!i)return;$('pt').textContent=i[0];$('pd').textContent=i[1];$('pop').classList.add('on');}
C.addEventListener('pointerdown',e=>{
 const r=C.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 for(let i=hot.length-1;i>=0;i--){
  const h=hot[i],hit=h.w!==undefined?(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h):Math.hypot(x-h.x,y-h.y)<=h.r+6;
  if(hit){pop(h.k);return;}
 }
});
$('px').onclick=()=>$('pop').classList.remove('on');
$('pop').onclick=e=>{if(e.target.id==='pop')$('pop').classList.remove('on');};
$('bPrev').onclick=()=>go(Math.max(0,stage-1),false);
$('bNext').onclick=()=>{if(stage<5)go(stage+1,false);};
$('bAuto').onclick=()=>{
 if(stage===5&&t>=1)go(0,true);
 else if(t>=1&&stage<5)go(stage+1,true);
 else{auto=true;playing=true;syncBtn();}
};
$('bPause').onclick=()=>{playing=!playing;syncBtn();};
$('bReset').onclick=()=>{shownATP=0;go(0,false);};
document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{spd=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('on',x===b));});
$('hyp').onchange=e=>{hyp=e.target.checked;if(hyp&&stage<4){}};
$('tl').oninput=e=>{t=e.target.value/1000;playing=false;auto=false;syncBtn();};
window.addEventListener('resize',fit);

/* ---------- 초기화 ---------- */
STAGES.forEach((s,i)=>{const c=document.createElement('div');c.className='chip';c.textContent=i===0?'세포 구조':i===5?'결과':s.n.replace(/\d단계 · /,(i)+'. ');c.onclick=()=>go(i,false);$('chips').appendChild(c);});
$('stats').innerHTML=STATS.map(s=>`<div class="st" data-k="${s[0]}"><small>${s[1]}</small><b>0</b><em>${s[3]}</em></div>`).join('');
vals=[...document.querySelectorAll('.st b')];
document.querySelectorAll('.st').forEach(el=>el.onclick=()=>pop(el.dataset.k));
fit();K=cnt();updateInfo();requestAnimationFrame(loop);
</script>
</body>
</html>
