        <title>TCA 회로 시뮬레이션</title>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Work+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
        <style>
            :root {
                --ink: #142d39;
                --teal: #087f75;
                --orange: #c75b27;
                --muted: #536873;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: 'Work Sans',sans-serif;
                color: var(--ink);
            }

            button:focus-visible {
                outline: 3px solid #ef8d49;
                outline-offset: 4px;
            }

            .app-shell {
                width: 100%;
                min-height: 100%;
                padding: clamp(18px,3vw,42px);
            }

            .app-inner {
                max-width: 1380px;
                margin: auto;
            }

            .eyebrow {
                text-transform: uppercase;
                letter-spacing: .16em;
            }

            .stage {
                position: absolute;
                z-index: 2;
                width: clamp(82px,11vw,128px);
                min-height: 68px;
                transform: translate(-50%,-50%);
                border: 2px solid #b9d8d3;
                border-radius: 15px;
                background: #fff;
                box-shadow: 0 7px 18px #16364313;
                padding: 7px 5px;
                text-align: center;
                transition: transform .2s,background .2s,border-color .2s,box-shadow .2s;
                cursor: pointer;
            }

            .stage:hover {
                transform: translate(-50%,-50%) scale(1.05);
            }

            .stage.active {
                background: #087f75;
                border-color: #087f75;
                color: white;
                box-shadow: 0 12px 26px #087f7560;
                transform: translate(-50%,-50%) scale(1.08);
            }

            .stage .number {
                display: block;
                font-size: 10px;
                opacity: .7;
                font-weight: 800;
                letter-spacing: .08em;
            }

            .stage .name {
                display: block;
                font-size: clamp(11px,1.05vw,14px);
                font-weight: 800;
                line-height: 1.25;
                word-break: keep-all;
            }

            .stage .carbon {
                display: inline-block;
                margin-top: 3px;
                padding: 1px 7px;
                border-radius: 20px;
                background: #fff0dc;
                color: #a44c1e;
                font-size: 11px;
                font-weight: 800;
            }

            .stage.active .carbon {
                background: #ffffff;
                color: #9b451d;
            }

            .arrow-step {
                position: absolute;
                z-index: 3;
                width: 32px;
                height: 32px;
                transform: translate(-50%,-50%);
                border-radius: 50%;
                background: #e4f2ee;
                color: #087f75;
                font-size: 20px;
                font-weight: 700;
                line-height: 1;
                box-shadow: 0 2px 7px #173b3b20;
                cursor: pointer;
            }

            .arrow-step:hover {
                background: #087f75;
                color: #fff;
            }

            .cycle {
                position: relative;
                width: min(100%,590px);
                aspect-ratio: 1;
                margin: auto;
            }

            .cycle-ring {
                position: absolute;
                inset: 17%;
                border: 3px dashed #a6cbc2;
                border-radius: 50%;
            }

            .cycle-core {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%,-50%);
                width: 35%;
                aspect-ratio: 1;
                border-radius: 50%;
                background: #ecf5ed;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 12px;
            }

            .cycle-core strong {
                color: #126f67;
                font-size: clamp(17px,2.4vw,28px);
                line-height: 1.1;
            }

            .cycle-core span {
                font-size: clamp(10px,1.1vw,13px);
                line-height: 1.4;
                color: #476b62;
                margin-top: 7px;
            }

            .panel {
                background: #fff;
                border: 1px solid #dce7e3;
                border-radius: 24px;
                box-shadow: 0 18px 45px #061c2620;
            }

            .pill {
                border-radius: 100px;
                padding: 6px 11px;
                font-weight: 700;
                font-size: 12px;
                display: inline-block;
            }

            .pill.produced {
                background: #dcf3e9;
                color: #126c50;
            }

            .pill.consumed {
                background: #e9eff9;
                color: #345b91;
            }

            .pill.carbon-change {
                background: #fff0db;
                color: #9c4c1f;
            }

            .control {
                border-radius: 12px;
                padding: 11px 16px;
                font-weight: 700;
                transition: transform .2s,filter .2s;
            }

            .control:hover {
                transform: translateY(-2px);
                filter: brightness(.94);
            }

            @media(max-width: 640px) {
                .cycle {
                    width:min(100%,440px);
                }

                .stage {
                    width: clamp(70px,21vw,100px);
                    min-height: 61px;
                }

                .stage .name {
                    font-size: 11px;
                }

                .arrow-step {
                    width: 25px;
                    height: 25px;
                    font-size: 16px;
                }

                .cycle-core {
                    width: 31%;
                }
            }

            @media(prefers-reduced-motion:reduce) {
                *,*::before,*::after {
                    transition: none!important;
                    animation: none!important;
                }
            }
        </style>

            const steps = [{
                name: '시트르산 생성',
                enzyme: '시트르산 합성효소',
                equation: '옥살아세트산(4C) + 아세틸-CoA(2C) + H₂O → 시트르산(6C) + CoA',
                consumed: ['옥살아세트산', '아세틸-CoA', 'H₂O'],
                produced: ['시트르산', 'CoA'],
                carbon: '4C + 2C → 6C',
                explanation: '아세틸-CoA의 탄소 2개가 옥살아세트산의 탄소 4개와 결합해 탄소 6개의 시트르산이 됩니다. 이 단계에서 물이 사용됩니다.'
            }, {
                name: '아이소시트르산 생성',
                enzyme: '아코니테이스',
                equation: '시트르산(6C) ⇄ 아이소시트르산(6C) (H₂O가 빠졌다가 다시 첨가됨)',
                consumed: ['시트르산', 'H₂O 재첨가'],
                produced: ['아이소시트르산', 'H₂O 일시 방출'],
                carbon: '6C → 6C',
                explanation: '물의 제거와 재첨가를 거쳐 분자 구조가 바뀝니다. 물은 과정 중 빠졌다가 다시 들어오므로 전체 순소모량은 0입니다.'
            }, {
                name: 'α-케토글루타르산 생성',
                enzyme: '아이소시트르산 탈수소효소',
                equation: '아이소시트르산(6C) + NAD⁺ → α-케토글루타르산(5C) + CO₂ + NADH + H⁺',
                consumed: ['아이소시트르산', 'NAD⁺'],
                produced: ['α-케토글루타르산', 'CO₂', 'NADH + H⁺'],
                carbon: '6C → 5C + CO₂',
                explanation: '첫 번째 이산화 탄소가 방출되면서 탄소 수가 6개에서 5개로 줄어듭니다. NAD⁺는 전자를 받아 NADH가 됩니다.'
            }, {
                name: '석시닐-CoA 생성',
                enzyme: 'α-케토글루타르산 탈수소효소 복합체',
                equation: 'α-케토글루타르산(5C) + CoA + NAD⁺ → 석시닐-CoA(4C) + CO₂ + NADH + H⁺',
                consumed: ['α-케토글루타르산', 'CoA', 'NAD⁺'],
                produced: ['석시닐-CoA', 'CO₂', 'NADH + H⁺'],
                carbon: '5C → 4C + CO₂',
                explanation: '두 번째 이산화 탄소가 방출되어 탄소 수가 5개에서 4개로 줄어듭니다. NADH도 한 분자 더 생성됩니다.'
            }, {
                name: '숙신산 생성',
                enzyme: '석시닐-CoA 합성효소',
                equation: '석시닐-CoA(4C) + ADP + Pi → 숙신산(4C) + CoA + ATP',
                consumed: ['석시닐-CoA', 'ADP + Pi'],
                produced: ['숙신산', 'CoA', 'ATP 또는 GTP'],
                carbon: '4C → 4C',
                explanation: '석시닐-CoA가 숙신산이 되면서 방출되는 에너지로 ATP가 만들어집니다. 생물이나 조직에 따라 GTP가 생성될 수도 있습니다.'
            }, {
                name: '푸마르산 생성',
                enzyme: '숙신산 탈수소효소',
                equation: '숙신산(4C) + FAD → 푸마르산(4C) + FADH₂',
                consumed: ['숙신산', 'FAD'],
                produced: ['푸마르산', 'FADH₂'],
                carbon: '4C → 4C',
                explanation: '숙신산에서 수소와 전자가 제거됩니다. FAD가 이를 받아 FADH₂가 됩니다.'
            }, {
                name: '말산 생성',
                enzyme: '푸마레이스',
                equation: '푸마르산(4C) + H₂O → 말산(4C)',
                consumed: ['푸마르산', 'H₂O'],
                produced: ['말산'],
                carbon: '4C → 4C',
                explanation: '푸마르산에 물 한 분자가 첨가되어 말산이 됩니다. 탄소 수는 변하지 않습니다.'
            }, {
                name: '옥살아세트산 재생',
                enzyme: '말산 탈수소효소',
                equation: '말산(4C) + NAD⁺ → 옥살아세트산(4C) + NADH + H⁺',
                consumed: ['말산', 'NAD⁺'],
                produced: ['옥살아세트산', 'NADH + H⁺'],
                carbon: '4C → 4C',
                explanation: '말산이 산화되어 옥살아세트산이 재생됩니다. 이제 새로운 아세틸-CoA와 결합하여 회로를 다시 시작할 수 있습니다.'
            }];
            const cycle = document.getElementById('cycle');
            let current = 0
              , timer = null;
            const stageButtons = [...document.querySelectorAll('.stage')];

            function positionCycle() {
                stageButtons.forEach( (button, i) => {
                    const angle = (-90 + i * 45) * Math.PI / 180;
                    button.style.left = (50 + 41 * Math.cos(angle)) + '%';
                    button.style.top = (50 + 41 * Math.sin(angle)) + '%';
                    const arrow = document.createElement('button');
                    arrow.type = 'button';
                    arrow.className = 'arrow-step';
                    arrow.textContent = '›';
                    arrow.setAttribute('aria-label', (i + 1) + '단계로 이동하는 화살표');
                    const a = (-112.5 + i * 45) * Math.PI / 180;
                    arrow.style.left = (50 + 41 * Math.cos(a)) + '%';
                    arrow.style.top = (50 + 41 * Math.sin(a)) + '%';
                    arrow.style.rotate = ((-112.5 + i * 45) + 90) + 'deg';
                    arrow.addEventListener('click', () => select(i));
                    cycle.appendChild(arrow);
                    button.addEventListener('click', () => select(i));
                }
                );
            }
            function pills(id, values, kind) {
                const host = document.getElementById(id);
                host.replaceChildren();
                values.forEach(value => {
                    const item = document.createElement('span');
                    item.className = 'pill ' + kind;
                    item.textContent = value;
                    host.appendChild(item);
                }
                );
            }
            function select(index) {
                current = index;
                const step = steps[current];
                stageButtons.forEach( (button, i) => {
                    button.classList.toggle('active', i === current);
                    button.setAttribute('aria-pressed', String(i === current));
                }
                );
                document.getElementById('step-indicator').textContent = `${current + 1} / 8 단계`;
                document.getElementById('reaction-name').textContent = step.name;
                document.getElementById('enzyme').textContent = '효소 · ' + step.enzyme;
                document.getElementById('equation').textContent = step.equation;
                document.getElementById('carbon-description').textContent = '탄소 수  ' + step.carbon;
                document.getElementById('explanation').textContent = step.explanation;
                pills('consumed', step.consumed, 'consumed');
                pills('produced', step.produced, 'produced');
            }
            function forward() {
                if (current === 7)
                    document.getElementById('summary').classList.remove('hidden');
                select((current + 1) % 8);
            }
            function stop() {
                if (timer)
                    clearInterval(timer);
                timer = null;
                document.getElementById('play').classList.remove('hidden');
                document.getElementById('pause').classList.add('hidden');
            }
            document.getElementById('previous').addEventListener('click', () => select((current + 7) % 8));
            document.getElementById('next').addEventListener('click', forward);
            document.getElementById('play').addEventListener('click', () => {
                if (timer)
                    return;
                timer = setInterval(forward, 2400);
                document.getElementById('play').classList.add('hidden');
                document.getElementById('pause').classList.remove('hidden');
            }
            );
            document.getElementById('pause').addEventListener('click', stop);
            positionCycle();
            select(0);
        </script>
    </body>
</html>
