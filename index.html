<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fcf6ed">
<title>세포와 물질대사 시뮬레이션</title>

<style>
:root {
  color-scheme: light;
  --ink: #352b4a;
  --muted: #665a71;
  --paper: #fcf6ed;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  background:
    radial-gradient(ellipse at 9% 0%, #ffe7d8, transparent 42%),
    radial-gradient(ellipse at 96% 9%, #e9e6ff, transparent 39%),
    var(--paper);
}

main {
  width: min(1120px, calc(100% - 48px));
  margin: auto;
  padding: 58px 0 72px;
}

.hero { text-align: center; margin: 0 0 31px; }

h1 {
  max-width: 820px;
  margin: 0 auto;
  font-size: clamp(2.1rem, 5.2vw, 4rem);
  font-weight: 900;
  line-height: 1.13;
  letter-spacing: -.065em;
  text-wrap: balance;
}

.guide {
  display: flex;
  align-items: center;
  gap: 23px;
  max-width: 715px;
  margin: 31px auto 45px;
}

.mascot {
  display: block;
  flex: none;
  width: clamp(112px, 17vw, 173px);
  height: auto;
  border: 3px solid #fffdf9;
  border-radius: 19px;
  box-shadow: 0 5px 0 #e3d9e9, 0 0 0 1px #d8cde4;
}

.bubble {
  position: relative;
  flex: 1;
  padding: 16px 22px;
  border: 1px solid #e3d9e9;
  border-radius: 19px;
  background: #fffdf9;
  box-shadow: 0 5px 0 #eee5ed;
}

.bubble::before {
  content: "";
  position: absolute;
  left: -7px;
  top: 30px;
  width: 12px;
  height: 12px;
  border-left: 1px solid #e3d9e9;
  border-bottom: 1px solid #e3d9e9;
  background: #fffdf9;
  transform: rotate(45deg);
}

.bubble strong { color: #51437c; font-size: .94rem; }

.bubble p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: .96rem;
  line-height: 1.6;
  word-break: keep-all;
}

.areas {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
  align-items: start;
}

.area {
  overflow: hidden;
  border: 1px solid #ddd4df;
  border-radius: 25px;
  background: #fffdf8;
  box-shadow: 0 6px 0 #e9dfe4, 0 12px 28px #50404e0c;
}

.mito { --color: #813f43; --wash: #ffded3; --shell: #f39785; --inside: #ffb4a3; }
.chloro { --color: #255d42; --wash: #def0d6; --shell: #8ccd88; --inside: #aee1a0; }
.whole { --color: #524383; --wash: #e9e0fa; --shell: #af9ae3; --inside: #d1bdf3; }

summary { cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }

summary:focus-visible, a:focus-visible {
  outline: 3px solid #554181;
  outline-offset: -4px;
}

.art {
  position: relative;
  display: grid;
  place-items: center;
  height: 148px;
  overflow: hidden;
  background: radial-gradient(circle at 50% 55%, #ffffffa0 0 49px, transparent 50px),
              var(--wash);
}

.art::before, .art::after {
  content: "";
  position: absolute;
  width: 184px;
  height: 95px;
  border: 1px solid #ffffffb0;
  border-radius: 50%;
  transform: rotate(-15deg);
}

.art::after { width: 199px; height: 107px; transform: rotate(15deg); }

.organelle {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 115px;
  height: 66px;
  border: 3px solid var(--color);
  border-radius: 54% 47% 49% 50%;
  background: var(--inside);
  box-shadow: inset 0 0 0 5px var(--shell), 0 7px 0 #40204c24;
  transform: rotate(-15deg);
}

.mito .organelle i {
  width: 14px;
  height: 33px;
  border: 3px solid var(--color);
  border-bottom: 0;
  border-radius: 12px 12px 0 0;
  transform: rotate(-9deg);
}

.mito .organelle i:nth-child(2) { margin-top: 12px; transform: rotate(171deg); }

.chloro .organelle { width: 109px; height: 68px; transform: rotate(-19deg); }

.chloro .organelle i {
  width: 19px;
  height: 5px;
  border: 1px solid #276345;
  border-radius: 50%;
  background: #488954;
  box-shadow: 0 -6px 0 #4c8857, 0 6px 0 #4c8857;
}

.chloro .organelle i:nth-child(2) { margin-top: -16px; }

.whole .organelle {
  width: 83px;
  height: 82px;
  border-radius: 44% 53% 45% 52%;
  transform: rotate(10deg);
}

.whole .organelle i:first-child {
  width: 30px;
  height: 29px;
  margin-left: 5px;
  border: 2px solid var(--color);
  border-radius: 50%;
  background: radial-gradient(circle at 63% 40%, #7d61b0 0 4px, #a083d4 5px);
}

.whole .organelle i:nth-child(2), .whole .organelle i:nth-child(3) {
  position: absolute;
  width: 11px;
  height: 7px;
  border: 1px solid #6e5a9b;
  border-radius: 50%;
  background: #f9e5fc;
}

.whole .organelle i:nth-child(2) { left: 15px; bottom: 16px; }
.whole .organelle i:nth-child(3) { right: 12px; top: 17px; }

.spark {
  position: absolute;
  width: 12px;
  height: 12px;
  background: var(--color);
  opacity: .55;
  clip-path: polygon(50% 0, 62% 37%, 100% 50%, 62% 63%, 50% 100%, 37% 63%, 0 50%, 37% 37%);
}

.s1 { left: 27%; top: 27%; }
.s2 { right: 24%; bottom: 26%; width: 16px; height: 16px; }

.card-body {
  display: flex;
  flex-direction: column;
  min-height: 184px;
  padding: 21px 21px 15px;
}

.place { color: var(--color); font-weight: 750; font-size: .85rem; }

.card-body strong {
  margin-top: 5px;
  font-size: clamp(1.2rem, 2.1vw, 1.55rem);
  letter-spacing: -.045em;
}

.topics {
  margin: 8px 0 14px;
  color: var(--muted);
  font-size: .88rem;
  line-height: 1.52;
  word-break: keep-all;
}

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  color: var(--color);
  font-size: .83rem;
  font-weight: 750;
}

.toggle {
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  border-radius: 50%;
  background: var(--wash);
}

.toggle::before {
  content: "";
  width: 7px;
  height: 7px;
  border-right: 2px solid;
  border-bottom: 2px solid;
  transform: translateY(-2px) rotate(45deg);
}

[open] .toggle::before { transform: translateY(2px) rotate(225deg); }
summary:hover .toggle { background: var(--color); color: white; }

.works { padding: 0 13px 14px; }
.group { padding: 12px 4px 0; border-top: 1px solid #eee6eb; }
.group + .group { margin-top: 9px; }
.group h2 { color: var(--color); font-size: .87rem; margin: 0 5px 6px; letter-spacing: -.02em; }
.group ul { list-style: none; margin: 0; padding: 0; }
.group li + li { margin-top: 3px; }

.group a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 6px;
  border-radius: 9px;
  color: var(--ink);
  text-decoration: none;
  font-size: .91rem;
  font-weight: 700;
  line-height: 1.38;
  word-break: keep-all;
}

.group a:hover { background: var(--wash); }

.group small {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: .74rem;
  font-weight: 500;
  overflow-wrap: anywhere;
}

.launch { flex: none; color: var(--color); font-weight: 750; }

@media (max-width: 800px) {
  main { padding-top: 44px; }
  .areas { grid-template-columns: 1fr; max-width: 570px; margin: auto; }
  .hero { margin-bottom: 26px; }
  .guide { max-width: 570px; margin-bottom: 32px; }
  .card-body { min-height: 0; }
  .art { height: 117px; }
}

@media (max-width: 430px) {
  main { width: calc(100% - 30px); padding-top: 35px; }
  .guide { gap: 13px; }
  .mascot { width: 97px; border-radius: 14px; }
  .bubble { padding: 11px 13px; }
  .bubble p { font-size: .87rem; }
}
</style>
</head>

<body>
<main>
  <header class="hero">
    <h1>세포와 물질대사 시뮬레이션</h1>
  </header>

  <aside class="guide" aria-label="이성세포 안내">
    <img class="mascot" src="./reason-cell.png" width="466" height="352"
         alt="책상에서 마이크로 안내하는 이성세포">
    <div class="bubble">
      <strong>이성세포</strong>
      <p>어서 와! 탐구하고 싶은 주제의 카드를 누르면 작품 목록이 열려.
         시뮬레이션을 실행하고 반응이 어디서, 어떤 순서로 일어나는지 살펴봐.</p>
    </div>
  </aside>

  <div class="areas" id="areas"></div>
</main>

<script>
const areas = [
  {
    id: 'mito',
    place: '마이토콘드리아',
    title: '세포호흡과 발효',
    topics: '해당과정 · 피루브산 산화 · TCA 회로 · 산화적 인산화 · 발효',
    groups: [
      ['세포호흡 전체 과정', [
        ['세포호흡', '20118, 20121'],
        ['세포호흡', '20122'],
        ['세포호흡', '20324, 20904'],
        ['세포호흡', '20327, 20417'],
        ['세포호흡', '20505, 20810'],
        ['세포호흡', '20612, 20613'],
        ['세포호흡', '20627, 20628'],
        ['세포호흡', '20918'],
        ['세포호흡', '21024']
      ]],
      ['해당과정 · 산화적 인산화', [
        ['해당과정', '20305, 20307'],
        ['해당과정', '20323'],
        ['해당과정, 산화적인산화', '20120, 20124', '해당과정과 산화적 인산화'],
        ['산화적 인산화', '20728']
      ]],
      ['피루브산 산화 · TCA 회로', [
        ['피루브산 산화와 TCA 회로', '20304, 20306, 20315, 20820'],
        ['TCA 회로', '20104, 20316'],
        ['TCA 회로', '20113, 20114'],
        ['TCA 회로', '20117'],
        ['TCA 회로', '20311, 20319']
      ]],
      ['발효', [
        ['세포호흡, 발효', '20802', '세포호흡과 발효'],
        ['세포호흡과 발효', '20818, 20921'],
        ['알코올 발효', '20111']
      ]]
    ]
  },
  {
    id: 'chloro',
    place: '엽록체',
    title: '광합성',
    topics: '명반응 · 탄소 고정 반응',
    groups: [
      ['광합성 전체 과정', [
        ['광합성', '20103, 20115'],
        ['광합성', '20105, 20426'],
        ['광합성', '20123'],
        ['광합성', '20125, 21014'],
        ['광합성', '20308, 20519'],
        ['광합성', '20406'],
        ['광합성', '20508'],
        ['광합성', '20622'],
        ['광합성', '20822, 20914']
      ]],
      ['명반응', [
        ['명반응', '20125, 20709'],
        ['명반응', '20309, 20318, 20321'],
        ['명반응', '20813, 20828'],
        ['명반응', '20908']
      ]],
      ['탄소 고정 반응', [
        ['탄소 고정 반응', '21012']
      ]],
      ['광합성 색소 분리', [
        ['시금치 크로마토그래피', '20325'],
        ['청경채 크로마토그래피', '20116']
      ]]
    ]
  },
  {
    id: 'whole',
    place: '세포',
    title: '세포호흡과 광합성 비교',
    topics: '전자전달계 · 물질대사 경로',
    groups: [
      ['전자전달계', [
        ['전자전달계 비교', '20126, 20326'],
        ['전자전달계 비교', '20902']
      ]],
      ['물질대사 경로', [
        [
          '피루브산 산화와 TCA 회로, 탄소고정 반응',
          '20718, 21024',
          '피루브산 산화와 TCA 회로 · 탄소 고정 반응'
        ]
      ]]
    ]
  }
];

const container = document.getElementById('areas');

for (const area of areas) {
  const card = document.createElement('details');
  card.id = area.id;
  card.className = `area ${area.id}`;

  const count = area.groups.reduce((total, [, entries]) => total + entries.length, 0);

  card.innerHTML = `
    <summary>
      <span class="art" aria-hidden="true">
        <span class="spark s1"></span>
        <span class="spark s2"></span>
        <span class="organelle"><i></i><i></i><i></i></span>
      </span>
      <span class="card-body">
        <span class="place">${area.place}</span>
        <strong>${area.title}</strong>
        <span class="topics">${area.topics}</span>
        <span class="card-foot">
          <span>작품 ${count}개</span>
          <span class="toggle" aria-hidden="true"></span>
        </span>
      </span>
    </summary>
    <div class="works"></div>`;

  const works = card.querySelector('.works');

  for (const [heading, entries] of area.groups) {
    const section = document.createElement('section');
    section.className = 'group';

    const title = document.createElement('h2');
    title.textContent = heading;
    const list = document.createElement('ul');

    for (const [fileTitle, ids, label = fileTitle] of entries) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      const name = document.createElement('span');
      const credit = document.createElement('small');
      const arrow = document.createElement('span');

      const filename = `${fileTitle} 시뮬레이션(${ids}).html`;
      link.href = './' + encodeURIComponent(filename);
      name.textContent = label;
      credit.textContent = ids;
      arrow.className = 'launch';
      arrow.setAttribute('aria-hidden', 'true');
      arrow.textContent = '↗';

      name.append(credit);
      link.append(name, arrow);
      item.append(link);
      list.append(item);
    }

    section.append(title, list);
    works.append(section);
  }

  container.append(card);
}
</script>
</body>
</html>
