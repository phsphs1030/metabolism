<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세포와 물질대사 시뮬레이션</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: #302545;
    background:
      radial-gradient(ellipse at 0% 0%, #ffe7d7, transparent 50%),
      radial-gradient(ellipse at 100% 0%, #eae3ff, transparent 55%),
      #fbf5eb;
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }

  main {
    width: min(1120px, calc(100% - 32px));
    margin: auto;
    padding: 52px 0 64px;
  }

  h1 {
    margin: 0 0 30px;
    text-align: center;
    font-size: clamp(2rem, 5.5vw, 3.8rem);
    font-weight: 900;
    letter-spacing: -.065em;
    word-break: keep-all;
  }

  .guide {
    display: flex;
    align-items: center;
    gap: 22px;
    max-width: 740px;
    margin: 0 auto 42px;
  }

  .face {
    position: relative;
    flex: 0 0 auto;
    width: 94px;
    aspect-ratio: 1;
    overflow: hidden;
    border: 4px solid #fffaf5;
    border-radius: 50%;
    background: #dce7ff;
    box-shadow: 0 4px 0 #cfc4e6;
  }

  /* 원본 사진에서 이성세포 얼굴이 보이는 위치 */
  .face img {
    position: absolute;
    width: 215%;
    left: -53%;
    top: -16%;
  }

  .bubble {
    position: relative;
    flex: 1;
    padding: 15px 21px;
    border: 1px solid #e2d8eb;
    border-radius: 20px;
    background: #fffdf8;
    box-shadow: 0 5px 0 #eee3eb;
  }

  .bubble::before {
    content: "";
    position: absolute;
    left: -7px;
    top: 32px;
    width: 12px;
    height: 12px;
    transform: rotate(45deg);
    border-left: 1px solid #e2d8eb;
    border-bottom: 1px solid #e2d8eb;
    background: #fffdf8;
  }

  .bubble strong { color: #534078; }
  .bubble p {
    margin: 6px 0 0;
    color: #60556b;
    line-height: 1.55;
    word-break: keep-all;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: start;
    gap: 20px;
  }

  .card {
    overflow: hidden;
    border: 1px solid #dfd4e0;
    border-radius: 24px;
    background: #fffdf8;
    box-shadow: 0 6px 0 #e9dde6;
  }

  .mito { --accent: #843f47; --soft: #ffded3; --fill: #ffa38f; }
  .chloro { --accent: #285f43; --soft: #dcefd5; --fill: #a0d691; }
  .cell { --accent: #554184; --soft: #e8def8; --fill: #c0aceb; }

  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }

  .illustration {
    display: grid;
    place-items: center;
    height: 145px;
    background:
      radial-gradient(ellipse at center, #ffffff85 0 32%, transparent 33%),
      var(--soft);
  }

  .icon {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 110px;
    height: 58px;
    transform: rotate(-18deg);
    border: 3px solid var(--accent);
    border-radius: 48%;
    background: var(--fill);
    box-shadow: inset 0 0 0 4px #ffffff45, 0 5px 0 #44305233;
  }

  .mito .icon i {
    width: 13px;
    height: 28px;
    border: 2px solid var(--accent);
    border-bottom: 0;
    border-radius: 8px 8px 0 0;
  }
  .mito .icon i:nth-child(2) { transform: rotate(180deg); }

  .chloro .icon i {
    width: 16px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 -6px var(--accent), 0 6px var(--accent);
  }
  .chloro .icon i:nth-child(2) { margin-top: -10px; }

  .cell .icon { width: 77px; height: 77px; }
  .cell .icon i:first-child {
    width: 27px;
    height: 27px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    background: #8d74bc;
  }
  .cell .icon i:not(:first-child) {
    position: absolute;
    width: 8px;
    height: 5px;
    border-radius: 50%;
    background: #fff3ff;
  }
  .cell .icon i:nth-child(2) { top: 16px; right: 14px; }
  .cell .icon i:nth-child(3) { bottom: 16px; left: 14px; }

  .label {
    display: flex;
    flex-direction: column;
    min-height: 173px;
    padding: 18px 20px 14px;
  }

  .place, .count { color: var(--accent); font-size: .86rem; font-weight: 800; }
  .title { margin-top: 5px; font-size: 1.2rem; letter-spacing: -.035em; }
  .topics { margin: 7px 0 13px; color: #60556b; line-height: 1.5; font-size: .87rem; }

  .card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
  }

  .toggle {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    color: var(--accent);
    background: var(--soft);
  }
  .toggle::before {
    content: "";
    width: 7px;
    height: 7px;
    border: solid currentColor;
    border-width: 0 2px 2px 0;
    transform: translateY(-2px) rotate(45deg);
  }
  details[open] .toggle::before { transform: translateY(2px) rotate(225deg); }

  .works { padding: 0 16px 16px; }
  .group { padding-top: 12px; border-top: 1px solid #eae1ec; }
  .group + .group { margin-top: 10px; }
  .group h2 { margin: 0 4px 5px; font-size: .88rem; color: var(--accent); }
  .group ul { list-style: none; margin: 0; padding: 0; }

  .work {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 9px 6px;
    border-radius: 8px;
    color: #302545;
    text-decoration: none;
    font-size: .9rem;
    line-height: 1.4;
  }
  .work:hover { background: var(--soft); }
  .work small { display: block; color: #60556b; margin-top: 2px; }
  summary:focus-visible, a:focus-visible { outline: 3px solid #674a93; outline-offset: -3px; }

  @media (max-width: 680px) {
    main { padding-top: 33px; }
    .guide { gap: 14px; margin-bottom: 28px; }
    .face { width: 69px; }
    .bubble { padding: 12px 15px; }
    .bubble p { font-size: .88rem; }
    .cards { grid-template-columns: 1fr; max-width: 500px; margin: auto; }
    .illustration { height: 112px; }
    .label { min-height: 0; }
  }
</style>
</head>

<body>
<main>
  <h1>세포와 물질대사 시뮬레이션</h1>

  <aside class="guide" aria-label="이성세포의 안내">
    <div class="face">
      <img src="./reason-cell.png" alt="이성세포의 얼굴">
    </div>
    <div class="bubble">
      <strong>이성세포</strong>
      <p>어서 와! 탐구하고 싶은 카드를 누르면 시뮬레이션 목록이 열려.
         반응이 어디서, 어떤 순서로 일어나는지 살펴보자.</p>
    </div>
  </aside>

  <div class="cards" id="cards"></div>
</main>

<script>
const areas = [
  {
    style: 'mito',
    place: '마이토콘드리아',
    title: '세포호흡과 발효',
    topics: '해당과정 · 피루브산 산화 · TCA 회로 · 산화적 인산화 · 발효',
    groups: [
      ['세포호흡 전체 과정', [
        ['세포호흡', '20118, 20121'],
        ['세포호흡', '20122'],
        ['세포호흡', '20327, 20417'],
        ['세포호흡', '20505, 20810']
      ]],
      ['해당과정과 산화적 인산화', [
        ['해당과정, 산화적인산화', '20120, 20124', '해당과정과 산화적 인산화']
      ]],
      ['피루브산 산화와 TCA 회로', [
        ['피루브산 산화와 TCA 회로', '20304, 20306, 20315, 20820'],
        ['TCA 회로', '20104, 20316'],
        ['TCA 회로', '20311, 20319']
      ]],
      ['발효', [
        ['세포호흡과 발효', '20818, 20921'],
        ['알코올 발효', '20111']
      ]]
    ]
  },
  {
    style: 'chloro',
    place: '엽록체',
    title: '광합성',
    topics: '명반응 · 탄소 고정 반응',
    groups: [
      ['광합성 전체 과정', [
        ['광합성', '20105, 20426'],
        ['광합성', '20125, 21014'],
        ['광합성', '20308, 20519'],
        ['광합성', '20406'],
        ['광합성', '20508'],
        ['광합성', '20622'],
        ['광합성', '20822, 20914']
      ]],
      ['명반응', [
        ['명반응', '20309, 20318, 20321'],
        ['명반응', '20813, 20828']
      ]]
    ]
  },
  {
    style: 'cell',
    place: '세포',
    title: '세포호흡과 광합성 비교',
    topics: '전자전달계 · 물질대사 경로',
    groups: [
      ['전자전달계', [
        ['전자전달계 비교', '20126, 20326']
      ]],
      ['물질대사 경로', [
        ['피루브산 산화와 TCA 회로, 탄소고정 반응', '20718, 21024',
         '피루브산 산화와 TCA 회로 · 탄소 고정 반응']
      ]]
    ]
  }
];

const cards = document.querySelector('#cards');

for (const area of areas) {
  const card = document.createElement('details');
  card.className = 'card ' + area.style;
  const count = area.groups.reduce((sum, [, works]) => sum + works.length, 0);

  card.innerHTML = `
    <summary>
      <span class="illustration" aria-hidden="true">
        <span class="icon"><i></i><i></i><i></i></span>
      </span>
      <span class="label">
        <span class="place">${area.place}</span>
        <strong class="title">${area.title}</strong>
        <span class="topics">${area.topics}</span>
        <span class="card-bottom">
          <span class="count">작품 ${count}개</span>
          <span class="toggle" aria-hidden="true"></span>
        </span>
      </span>
    </summary>
    <div class="works"></div>`;

  const panel = card.querySelector('.works');
  for (const [heading, works] of area.groups) {
    const section = document.createElement('section');
    section.className = 'group';
    const title = document.createElement('h2');
    title.textContent = heading;
    const list = document.createElement('ul');

    for (const [fileTitle, ids, label = fileTitle] of works) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      const text = document.createElement('span');
      const credit = document.createElement('small');
      const arrow = document.createElement('span');

      link.className = 'work';
      link.href = './' + encodeURIComponent(`${fileTitle} 시뮬레이션(${ids}).html`);
      text.textContent = `${label} 시뮬레이션`;
      credit.textContent = ids;
      arrow.textContent = '↗';
      arrow.setAttribute('aria-hidden', 'true');

      text.append(credit);
      link.append(text, arrow);
      item.append(link);
      list.append(item);
    }

    section.append(title, list);
    panel.append(section);
  }
  cards.append(card);
}
</script>
</body>
</html>
