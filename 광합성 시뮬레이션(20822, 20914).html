        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>엽록체 광합성 시뮬레이션</title>
        <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;family=Source+Serif+Pro:wght@600;700&amp;display=swap" rel="stylesheet">
        <style>
            :root {
                --forest: #102e27;
                --green: #28775c;
                --lime: #d6eb9d;
                --paper: #f7f7ed;
                --ink: #19362e;
                --muted: #62776b;
                --gold: #f4bd55
            }

            * {
                box-sizing: border-box
            }

            body {
                margin: 0;
                width: 100%;
                font-family: "Work Sans",sans-serif;
                color: var(--ink)
            }

            .app-shell {
                width: 100%;
                min-height: 100%;
                padding: clamp(18px,3vw,42px);
                background: radial-gradient(circle at 90% 0%,#295f49 0%,transparent 38%),var(--forest)
            }

            .workspace {
                max-width: 1440px;
                margin: auto
            }

            .title {
                font-family: "Source Serif Pro",serif;
                letter-spacing: -.035em
            }

            .eyebrow {
                letter-spacing: .2em;
                text-transform: uppercase
            }

            .panel {
                background: var(--paper);
                border: 1px solid #dce5d4;
                border-radius: 24px;
                box-shadow: 0 18px 45px #071a1530
            }

            .tab,.step,.mode {
                border: 1px solid #d8dfd2;
                background: #fff;
                border-radius: 999px;
                padding: 9px 15px;
                font-weight: 700;
                transition: transform .2s,background .2s,color .2s
            }

            .tab:hover,.step:hover,.mode:hover {
                transform: translateY(-2px)
            }

            .tab[aria-selected=true],.step[aria-pressed=true],.mode[aria-pressed=true] {
                background: var(--forest);
                color: #fff;
                border-color: var(--forest)
            }

            .control {
                background: var(--green);
                color: white;
                border-radius: 999px;
                padding: 10px 19px;
                font-weight: 700
            }

            button:focus-visible,input:focus-visible {
                outline: 3px solid #e9ad38;
                outline-offset: 3px
            }

            input {
                accent-color: var(--green)
            }

            .diagram-frame {
                background: #eef4dc;
                border: 1px solid #dce6d5;
                border-radius: 20px;
                overflow: hidden
            }

            .diagram {
                position: relative;
                width: 100%;
                aspect-ratio: 900/455;
                min-height: 305px
            }

            .diagram svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%
            }

            .zone-label {
                position: absolute;
                z-index: 2;
                left: 3%;
                padding: 5px 9px;
                border-radius: 8px;
                background: #f7f7ede8;
                font-weight: 700;
                font-size: clamp(10px,1.15vw,14px)
            }

            .zone-label.top {
                top: 3%
            }

            .zone-label.middle {
                top: 33%;
                background: #e6eed6ee
            }

            .zone-label.bottom {
                bottom: 4%;
                background: #e6f2ebee
            }

            .protein-label {
                position: absolute;
                z-index: 2;
                top: 49%;
                transform: translate(-50%,-50%);
                text-align: center;
                font-weight: 700;
                font-size: clamp(10px,1.35vw,16px);
                line-height: 1.25;
                white-space: nowrap;
                pointer-events: none
            }

            .protein-label small {
                display: block;
                font-size: .72em;
                font-weight: 600
            }

            .legend-dot {
                display: inline-block;
                width: 11px;
                height: 11px;
                border-radius: 50%;
                margin-right: 6px;
                vertical-align: middle
            }

            .reaction-path {
                fill: none;
                stroke-width: 5;
                stroke-linecap: round;
                stroke-dasharray: 8 9;
                opacity: .85
            }

            .electron-path {
                stroke: #be8022
            }

            .proton-path {
                stroke: #078f98
            }

            .diagram[data-step="0"] .water-node,.diagram[data-step="1"] .psii-node,.diagram[data-step="2"] .pump-node,.diagram[data-step="3"] .psi-node,.diagram[data-step="4"] .atp-node {
                filter: drop-shadow(0 0 10px #f4bd55);
                stroke: #d79023;
                stroke-width: 5
            }

            .diagram.cyclic .noncyclic-only {
                opacity: .16
            }

            .diagram:not(.cyclic) .cyclic-only {
                display: none
            }

            .diagram.cyclic .cyclic-only {
                display: block
            }

            .readout {
                background: #eaf0dc;
                border-radius: 16px;
                padding: 15px
            }

            .meter {
                height: 7px;
                border-radius: 9px;
                background: #cbd6bf;
                overflow: hidden
            }

            .meter span {
                display: block;
                height: 100%;
                background: #3e9266;
                transition: width .3s
            }

            .cycle-node {
                border: 2px solid #9db398;
                background: #fffef6;
                border-radius: 18px;
                padding: 18px;
                transition: .25s
            }

            .cycle-node.active {
                border-color: #d79023;
                box-shadow: 0 0 0 4px #f7cf7590
            }

            .badge {
                background: #e6eed6;
                border-radius: 999px;
                padding: 4px 10px;
                font-size: 12px;
                font-weight: 700;
                display: inline-block
            }

            .hidden-view {
                display: none!important
            }

            @media(max-width: 700px) {
                .diagram {
                    min-height:260px
                }

                .protein-label {
                    top: 52%;
                    font-size: 10px
                }

                .zone-label {
                    font-size: 10px
                }

                .cycle-grid {
                    grid-template-columns: 1fr!important
                }

                .cycle-arrow {
                    transform: rotate(90deg);
                    justify-self: center
                }
            }

            @media(prefers-reduced-motion:reduce) {
                *,*:before,*:after {
                    animation-duration: .01ms!important;
                    transition-duration: .01ms!important
                }
            }
        </style>

        <script>
            const lightStages = [["물의 광분해", "타이라코이드 내부 쪽에서 물이 분해됩니다. 청록색 H⁺는 내부에 더해지고, 금색 전자는 광계 II로 이동하며 산소가 방출됩니다.", "2H₂O → O₂ + 4H⁺ + 4e⁻"], ["광계 II: 빛 흡수", "막에 박힌 광계 II가 빛을 흡수합니다. P680에서 들뜬 전자가 전자 전달계로 이동하고, 물의 전자가 빈자리를 채웁니다.", "금색 입자의 이동: 물 → 광계 II → 전자 전달계"], ["전자 전달과 H⁺ 펌프", "전자가 전달계를 통과하며 내놓는 에너지로 H⁺가 스트로마에서 막을 가로질러 타이라코이드 내부로 이동합니다.", "청록색 입자의 아래쪽 이동: 스트로마 → 타이라코이드 내부"], ["광계 I과 NADPH", "비순환 흐름에서 광계 I이 빛을 받아 전자를 다시 들뜨게 하고 NADP⁺가 NADPH로 환원됩니다. 순환 흐름에서는 전자가 전달계로 되돌아갑니다.", "순환 흐름에서는 물 분해와 NADPH 생성이 일어나지 않습니다."], ["화학삼투와 ATP 합성", "내부에 모인 H⁺가 ATP 합성효소를 통과해 스트로마로 확산됩니다. 이 흐름의 에너지로 ATP가 만들어집니다.", "청록색 입자의 위쪽 이동: 타이라코이드 내부 → 스트로마"]];
            const calvinStages = [["탄소고정", "스트로마에서 루비스코가 CO₂를 RuBP에 결합시켜 3PG를 형성합니다.", "3 CO₂ + 3 RuBP → 6 3PG"], ["3PG 환원", "명반응에서 공급받은 ATP와 NADPH를 사용해 3PG를 G3P로 환원합니다.", "ATP는 에너지를, NADPH는 환원력을 제공합니다."], ["RuBP 재생", "일부 G3P는 탄수화물 합성에 쓰이고 나머지는 ATP를 사용해 RuBP로 재생됩니다.", "3 CO₂마다 G3P 1분자가 순생산됩니다."]];
            const state = {
                view: "light",
                lightStep: 0,
                calvinStep: 0,
                cyclic: false,
                playing: true,
                timer: null
            };
            const $ = id => document.getElementById(id);
            const svg = $("reaction-svg");
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
            function syncMotion() {
                if (state.playing && Number($("light-slider").value) > 0 && !reduceMotion.matches && state.view === "light")
                    svg.unpauseAnimations();
                else
                    svg.pauseAnimations();
            }
            function render() {
                const light = state.view === "light";
                $("light-view").classList.toggle("hidden-view", !light);
                $("calvin-view").classList.toggle("hidden-view", light);
                $("light-tab").setAttribute("aria-selected", String(light));
                $("calvin-tab").setAttribute("aria-selected", String(!light));
                document.querySelectorAll("[data-light-step]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.lightStep) === state.lightStep)));
                document.querySelectorAll("[data-calvin-step]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.calvinStep) === state.calvinStep)));
                $("noncyclic").setAttribute("aria-pressed", String(!state.cyclic));
                $("cyclic").setAttribute("aria-pressed", String(state.cyclic));
                $("diagram").classList.toggle("cyclic", state.cyclic);
                $("diagram").dataset.step = state.lightStep;
                $("noncyclic-route").classList.toggle("hidden", state.cyclic);
                $("cyclic-route").classList.toggle("hidden", !state.cyclic);
                ["fix", "reduce", "regenerate"].forEach( (name, i) => $("cycle-" + name).classList.toggle("active", !light && i === state.calvinStep));
                const info = light ? lightStages[state.lightStep] : calvinStages[state.calvinStep];
                $("active-title").textContent = info[0];
                $("active-description").textContent = info[1];
                $("active-connection").textContent = info[2];
                $("play").classList.toggle("hidden", state.playing);
                $("pause").classList.toggle("hidden", !state.playing);
                updateMetrics();
                syncMotion();
            }
            function updateMetrics() {
                const intensity = Number($("light-slider").value);
                $("light-value").textContent = intensity + "%";
                $("stroma-ph").textContent = (7.2 + intensity * .01).toFixed(1);
                $("lumen-ph").textContent = (7 - intensity * .02).toFixed(1);
                $("stroma-meter").style.width = (40 + intensity * .45) + "%";
                $("lumen-meter").style.width = (85 - intensity * .55) + "%";
                const rate = intensity === 0 ? "없음" : intensity < 35 ? "낮음" : intensity < 75 ? "보통" : "높음";
                $("atp-output").textContent = rate;
                $("nadph-output").textContent = state.cyclic ? "생성 안 됨" : rate;
                document.querySelectorAll("animateMotion.moving").forEach(a => a.setAttribute("dur", (7 - intensity * .045).toFixed(2) + "s"));
                syncMotion();
            }
            function stop() {
                clearInterval(state.timer);
                state.timer = null;
                state.playing = false;
                render()
            }
            function start() {
                if (state.playing)
                    return;
                state.playing = true;
                render();
                schedule();
            }
            function schedule() {
                clearInterval(state.timer);
                if (!state.playing)
                    return;
                state.timer = setInterval( () => {
                    if (state.view === "light")
                        state.lightStep = (state.lightStep + 1) % lightStages.length;
                    else
                        state.calvinStep = (state.calvinStep + 1) % calvinStages.length;
                    render();
                }
                , 2800);
            }
            $("light-tab").addEventListener("click", () => {
                state.view = "light";
                render()
            }
            );
            $("calvin-tab").addEventListener("click", () => {
                state.view = "calvin";
                render()
            }
            );
            document.querySelectorAll("[data-light-step]").forEach(b => b.addEventListener("click", () => {
                state.lightStep = Number(b.dataset.lightStep);
                render()
            }
            ));
            document.querySelectorAll("[data-calvin-step]").forEach(b => b.addEventListener("click", () => {
                state.calvinStep = Number(b.dataset.calvinStep);
                render()
            }
            ));
            $("noncyclic").addEventListener("click", () => {
                state.cyclic = false;
                render()
            }
            );
            $("cyclic").addEventListener("click", () => {
                state.cyclic = true;
                state.lightStep = 3;
                render()
            }
            );
            $("light-slider").addEventListener("input", updateMetrics);
            $("play").addEventListener("click", start);
            $("pause").addEventListener("click", stop);
            reduceMotion.addEventListener("change", syncMotion);
            render();
            schedule();
        </script>
